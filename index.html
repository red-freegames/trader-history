<style>
:root{
  --bg:#090c13; --panel:#111725; --panel2:#161e30; --line:#232d45; --text:#e8ecf5; --sub:#8b95ad; --dim:#5b6580;
  --A:#ff5d4f; --B:#2fd89c; --C:#7fb2ff; --gold:#f5c451; --purple:#b48cff; --danger:#ff4d6d; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans SC","Noto Sans KR","Yu Gothic UI","Malgun Gothic","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#1a2340 0%,var(--bg) 60%) fixed}
button,select,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
#game{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 16px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.when{display:flex;align-items:center;gap:10px;min-width:0}
.age{white-space:nowrap;font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.age small{font-size:12px;color:var(--sub);margin-left:2px;font-weight:600}
.yinfo{min-width:0}
.year{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.stage{font-size:11px;color:#c9d3ec;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.cbtn{border:0;background:transparent;border-radius:9px;min-width:34px;height:34px;font-size:13px;font-weight:800;color:var(--sub);padding:0 6px}
.cbtn.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #34405f}
#btnPause{font-size:15px;color:var(--text)}
#btnPause.paused{background:var(--gold);color:#1a1300}
#btnAuto.on{background:linear-gradient(135deg,#7d5cff,#4f7cff);color:#fff}
.yearbar{position:relative;height:16px;margin:8px 0 6px;background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
#yearFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#2a3866,#4460b0)}
.yearbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:10px;color:#c9d3ec;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.chips span{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:#c7cfe2}
.chips span.off{color:var(--dim)}
.chips span.hl{background:linear-gradient(135deg,#3a2a7a,#23366e);border-color:#7d5cff;color:#fff}
.ticker{display:flex;align-items:center;height:30px;background:#0d1220;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tlabel{flex:none;height:100%;display:flex;align-items:center;padding:0 8px;background:var(--danger);color:#fff;font-size:10px;font-weight:900;letter-spacing:1px}
.tview{flex:1;overflow:hidden;white-space:nowrap}
#tickerText{display:inline-block;padding-left:100%;font-size:13px;font-weight:600;animation:mq 16s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* layout */
.cols{display:flex;flex-direction:column}
.cols>section{display:contents}
#logBox{order:9}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-top:8px}
.boxh{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}
.help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid #4a5a85;background:var(--panel2);color:#c7cfe2;font-size:11px;font-weight:900;padding:0;margin-left:4px;vertical-align:1px;flex:none}
.chartbox{position:relative;margin-top:8px;background:linear-gradient(180deg,#0f1524,#0b101b);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ctabs{position:absolute;top:6px;right:6px;display:flex;gap:3px;z-index:2}
.ctabs button{border:1px solid var(--line);background:rgba(17,23,37,.88);color:var(--sub);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px}
.ctabs button.on{color:var(--text);border-color:#4a5a85}
#cv{display:block;width:100%;height:220px}
#toast{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 11px;border-radius:11px;background:rgba(14,19,32,.95);border:1px solid #33405f;font-size:12.5px;line-height:1.45;font-weight:600;transform:translateY(130%);opacity:0;transition:.3s;pointer-events:none;white-space:pre-line}
#toast.show{transform:none;opacity:1}
.badge{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.k-hist{background:var(--gold);color:#241a00}.k-rumor{background:#4c6fd6;color:#fff}.k-life{background:var(--purple);color:#1d0f3a}
.k-flash{background:var(--danger);color:#fff}.k-fake{background:#566079;color:#fff}.k-sys{background:#2b3a5c;color:#cfe}.k-auto{background:#5a4ad0;color:#fff}.k-pick{background:#2fd89c;color:#062a1c}

/* status */
.stat{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.stat .box{margin-top:0}
.big{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.sline{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);font-weight:700;margin-top:4px}
.sline b{color:var(--text)}
.kb{position:relative;padding-right:54px!important}
.avatar{position:absolute;right:7px;top:7px;width:42px;border-radius:8px;overflow:hidden;border:1px solid #3a4870}
.kbar{height:8px;border-radius:4px;margin:6px 0 4px;background:linear-gradient(90deg,#1b1b1f,#5b6070 50%,#f2f5ff);position:relative}
#karmaMark{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px var(--gold);transform:translateX(-2px);transition:left .2s}
.ksub{font-size:10px;color:var(--dim);font-weight:700}
.firebar{height:8px;border-radius:4px;background:#1d2538;overflow:hidden;margin-top:6px}
.firebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a3c,#f5c451)}
.firetxt{font-size:11px;font-weight:800;color:#ffcf8a;margin-top:3px}

/* portfolio */
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#1d2538;margin-bottom:8px}
.stack i{display:block;height:100%}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.prow:first-of-type{border-top:0}
.pn{font-size:13px;font-weight:800;line-height:1.25}
.pn i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.pn small{display:block;font-size:10px;color:var(--sub);font-weight:600;margin-top:1px}
.pp{text-align:right;font-size:12px;font-weight:800;line-height:1.3}
.pp small{display:block;font-size:10.5px}
.ph{text-align:right;font-size:12px;font-weight:800;min-width:78px;line-height:1.3}
.ph small{display:block;font-size:10.5px;color:var(--sub)}
.tradebtns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tradebtns button{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;font-weight:800}
.tradebtns button.buy{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
.tradebtns button:disabled{opacity:.35}
.amts{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--sub);font-weight:700}
.amts button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:800;color:var(--sub)}
.amts button.on{border-color:var(--gold);color:var(--gold)}
.up{color:var(--B)}.down{color:var(--A)}
.stars{color:#ff9a3c;letter-spacing:-1px;font-size:10px}
.cashrow{display:flex;justify-content:space-between;font-size:12px;font-weight:800;padding-top:8px;border-top:1px dashed var(--line);margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.acts button{min-height:46px;border-radius:11px;border:1px solid #33405f;background:var(--panel2);font-size:12px;font-weight:800;line-height:1.2;padding:4px}
.acts button.fire{border-color:#8a5a20;background:linear-gradient(135deg,#3a2410,#1a1410)}
.acts button.fire.ready{border-color:var(--gold);box-shadow:0 0 14px rgba(245,196,81,.45);color:#ffe9a0}
.acts button:disabled{opacity:.45}
.acts button small{display:block;font-size:9.5px;color:var(--sub);font-weight:700;margin-top:2px}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:10px;background:#2a3350;position:relative;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cbd3ea;transition:.2s}
.sw input:checked{background:var(--danger)}
.sw input:checked::after{left:18px;background:#fff}
.hardx{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.hardx button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800}
details.log{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px}
details.log summary{font-size:12px;font-weight:800;color:var(--sub);cursor:pointer}
#log{list-style:none;margin:6px 0 0;padding:0;max-height:230px;overflow:auto}
#log li{font-size:11.5px;line-height:1.45;padding:5px 0;border-top:1px dashed var(--line);color:#c7cfe2;white-space:pre-line}
#log li em{font-style:normal;color:var(--dim);margin-right:6px}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap;gap:6px}
.footer select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px}
.linkbtn{background:none;border:0;color:var(--C);font-weight:800;font-size:12.5px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.verline{font-size:10.5px;color:var(--dim);text-align:center;margin-top:6px}
.streamok{font-size:10.5px;color:#8fd0a8;font-weight:700;text-align:center;margin-top:4px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,12,.82);backdrop-filter:blur(8px);overflow:auto}
.panel{width:100%;max-width:440px;background:linear-gradient(180deg,#141b2c,#0d121e);border:1px solid #2c3858;border-radius:20px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.langs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--sub)}
.langs button.on{border-color:var(--gold);color:var(--gold)}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.1;background:linear-gradient(90deg,var(--A),var(--gold) 50%,var(--B));-webkit-background-clip:text;background-clip:text;color:transparent}
.appsub{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-top:4px}
.tag{color:var(--sub);font-size:13px;margin:8px 0 14px;line-height:1.6}
.rules{font-size:12.5px;line-height:1.7;color:#c7cfe2;padding-left:18px;margin:0 0 14px}
.rules b{color:var(--text)}
.bigbtn{display:block;width:100%;min-height:52px;border-radius:14px;border:0;font-size:16px;font-weight:900;margin-top:10px;padding:8px}
.primary{background:linear-gradient(90deg,#4f7cff,#7d5cff);color:#fff;box-shadow:0 8px 24px rgba(90,100,255,.35)}
.ghost{background:var(--panel2);border:1px solid #33405f!important}
.xbtn{background:#000;color:#fff;border:1px solid #444!important}
.note{font-size:11px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.5}
.center{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.chlog{margin-top:12px;font-size:11.5px;color:var(--sub)}
details.chlog summary{cursor:pointer;font-weight:800}
details.chlog p{margin:6px 0 0;line-height:1.55}
.rq{font-size:12.5px;color:var(--sub);font-weight:800;letter-spacing:1px}
.rh2{font-size:23px;font-weight:900;margin:4px 0 12px;line-height:1.3}
.rcard{display:block;width:100%;text-align:left;border:1px solid #33405f;background:#0f1525;border-radius:16px;padding:13px 14px;margin-top:9px;position:relative}
.rcard:hover{border-color:#5a6a95}
.rcard:active{transform:scale(.985)}
.rcard b{display:block;font-size:16px;font-weight:900;padding-right:100px;line-height:1.35}
.rcard .rsub{font-size:12px;color:#c7cfe2;font-weight:600;margin-top:4px;line-height:1.55}
.rcard ul{margin:8px 0 0;padding-left:18px;font-size:12px;line-height:1.65;color:#c7cfe2}
.rcard li.minus{color:#ff9a8f}
.rcard .rtag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;max-width:110px;text-align:center;background:#2b3a5c;color:#dfe}
.rcard .hint{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;background:#1d2a48;color:#bcd0ff}
.rcard .meter{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;font-weight:800;color:var(--sub)}
.rcard .wbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1d2538;margin-top:7px}
.rcard .wbar i{display:block;height:100%}
.rcard.cur{border-color:var(--gold)}
.rcard:disabled{opacity:.45;cursor:not-allowed}
.rcard.blue{border-color:#4a6aa8}.rcard.blue .rtag{background:var(--C);color:#0a1020}
.rcard.gold{border-color:#8a6a20}.rcard.gold .rtag{background:var(--gold);color:#2a1c00}
.rcard.red{border-color:#8a3040}.rcard.red .rtag{background:var(--danger);color:#fff}
.rcard.green{border-color:#2a7a5a}.rcard.green .rtag{background:var(--B);color:#062a1c}
.rcard.purple{border-color:#7d5cff;background:linear-gradient(135deg,#1a1440,#0f1525)}.rcard.purple .rtag{background:linear-gradient(90deg,#ff5d8f,#7d5cff);color:#fff}
.rback{background:none;border:0;color:var(--sub);font-size:13px;font-weight:700;padding:6px 0}
#choiceScr{z-index:58}
.cbanner{display:flex;gap:12px;align-items:center}
.cbanner .cav{width:62px;flex:none;border-radius:12px;overflow:hidden;border:1px solid #3a4870}
.cbanner .cage{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:1px}
.ctext{font-size:13.5px;line-height:1.7;color:#dfe5f2;margin:10px 0 4px;white-space:pre-line}
.cfoot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.cfoot button{min-height:42px;border-radius:10px;border:1px solid #33405f;background:var(--panel2);font-size:11.5px;font-weight:800;line-height:1.2;padding:4px}
.cfoot button:disabled{opacity:.4}
.cfoot button small{display:block;font-size:9.5px;color:var(--sub)}

/* result */
.rhead{text-align:center}
.rhead .rk{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:1px}
.rtitle{font-size:27px;font-weight:900;margin:6px 0 4px}
.rdesc{font-size:12.5px;color:#c7cfe2;line-height:1.6}
.rstatus{display:inline-block;font-size:13px;font-weight:900;letter-spacing:3px;padding:4px 14px;border-radius:999px;margin-bottom:8px}
.rstatus.clear{color:#1a1300;background:linear-gradient(90deg,var(--gold),#ffe28a)}
.rstatus.over{color:#fff;background:var(--danger)}
.rstatus.fire{color:#1a1300;background:linear-gradient(90deg,#ff9a3c,#f5c451)}
.evalcard{margin:6px auto 4px;display:inline-flex;flex-direction:column;align-items:center;padding:8px 22px;border-radius:14px;border:2px solid var(--c,#4a5a85);background:color-mix(in srgb,var(--c,#4a5a85) 14%,#0d1220)}
.evalcard small{font-size:10.5px;color:var(--sub);font-weight:800;letter-spacing:2px}
.evalcard b{font-size:24px;font-weight:900;color:var(--c,#fff)}
.rlbl{display:block;font-size:10.5px;color:var(--sub);font-weight:700;margin-top:10px;letter-spacing:1px}
.rmain{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.rmain div{background:#0d1220;border:1px solid #33405f;border-radius:14px;padding:10px 12px}
.rmain label{display:block;font-size:11px;color:var(--sub);font-weight:800}
.rmain b{display:block;font-size:21px;font-weight:900;margin-top:2px}
.rmain b small{font-size:12px;color:var(--sub)}
.rmain span{font-size:11px;color:var(--sub);font-weight:700}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.rstats div{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rstats label{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.rstats b{font-size:16px}
svg{display:block;width:100%;height:auto}
.rchar{position:relative;width:170px;margin:10px auto 2px;border-radius:18px;overflow:hidden;border:1px solid #3a4870}
.newb{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;animation:pop .6s .2s ease-out both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.rarebanner{margin:10px 0 0;padding:10px;border-radius:14px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff5d8f,#f5c451,#2fd89c,#7fb2ff,#b48cff);background-size:200%;animation:rainbow 3s linear infinite}
.bragbtn{display:block;width:100%;min-height:72px;margin:14px 0 4px;border-radius:18px;border:3px solid #fff;font-size:22px;font-weight:900;color:#fff;background:#000;box-shadow:0 0 30px rgba(180,140,255,.7);animation:bragpulse 1.4s ease-in-out infinite}
.bragbtn small{display:block;font-size:12px;font-weight:700;color:#f5c451;margin-top:2px}
@keyframes bragpulse{50%{transform:scale(1.03)}}

.menu button{display:block;width:100%;text-align:left;margin-top:8px;border:1px solid #33405f;background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:800}

/* ==================== データ参照のヘルパー ==================== */
const txt = o => o ? (o[LANG] !== undefined ? o[LANG] : o.ja) : '';
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const inPeriod = x => (!x.from || today() >= x.from) && (!x.to || today() <= x.to);
const modeById = id => CONST_MODES.find(m => m.id===id) || CONST_MODES[0];
const availableModes = () => CONST_MODES.filter(m => m.enabled !== false && (!m.limited || inPeriod(m)));
const activeSeasons = () => CONST_SEASON_EVENTS.filter(s => s.enabled || ((s.from || s.to) && inPeriod(s)));
const AIDS = CONST_ASSETS.map(a => a.id);
const assetById = id => CONST_ASSETS.find(a => a.id===id);
const allocById = id => CONST_ALLOCS.find(a => a.id===id);
const turnById = id => CONST_TURNS.find(t => t.id===id);
const stars = n => '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(5-n) + '</span>';
function weightedPick(list, mult){
  const ws = list.map(d => (d.w ?? 1) * mult.reduce((x, m) => x * ((m && m[d.id]) ?? 1), 1));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for(let i=0;i<list.length;i++){ r -= ws[i]; if(r <= 0) return list[i]; }
  return list[list.length-1];
}

/* ==================== 状態 ==================== */
let S = null;
const ui = { mode:'price', range:'3y', paused:true, running:false, amt:1 };
const route = () => ROUTES[S.route] || ROUTES.high;
const mode = () => modeById(S.mode);
const isChoice = () => mode().style === 'choice';

function newState(routeId = 'high', modeId = 'easy', style = 'work'){
  const R = ROUTES[routeId] || ROUTES.high, M = modeById(modeId);
  S = { v:3, route:routeId, mode:M.id, startAge:R.startAge, skill:{...R.skill}, kBias:R.kBias, y0:3000 + rint(10, 89),
        age:R.startAge, tick:0, t:0, cash:R.cash, sh:{}, cost:{}, px:{}, hp:{}, hT:[R.cash],
        style:'work', jobMul:1, extra:0, alloc:null, allocId:null, retired:0,
        karma:50+R.kBias, kAcc:0, kN:0, margin:false, auto:false, insured:0, restarts:0, styleChanges:0, speed:M.speed || 1,
        marks:[], pending:[], log:[], queue:[], yearly:[R.cash], yearlyK:[50+R.kBias], yearStart:R.cash, peak:R.cash,
        lifeDone:{}, flags:{}, turnsDone:{}, sched:[], over:false };
  for(const id of AIDS){ S.sh[id] = 0; S.cost[id] = 0; S.px[id] = 100; S.hp[id] = [100]; }
  if(style === 'invest') setStyle('invest', true);
  S.sched = scheduleYear(S.age);
}
function setStyle(st, silent){
  if(S.style === st) return;
  if(!silent) S.styleChanges = (S.styleChanges||0) + 1;
  S.style = st;
  if(st === 'invest'){ S.skill.ana = Math.max(S.skill.ana, 1); S.skill.trade = 1; S.investSince = S.age; }
  if(!silent) logT('styleChanged', {s:D().styleNames[st]});
}
function basePay(age){ let v = 0; for(const [a, p] of route().pay) if(age >= a) v = p; return v; }
function income(age){
  let v;
  if(S.flags.welfare) return 0;
  if(S.style === 'fire' || S.retired) v = -1.5e6;
  else if(age >= 65) v = (S.flags.rehire && age < 70 && S.style === 'work') ? basePay(64) * S.skill.earn * S.jobMul * .6 : -1.5e6;
  else if(S.style === 'invest') v = total() < 2e6 ? 0 : -4e5; // 資産200万円未満はバイトで食いつなぐ
  else v = basePay(age) * S.skill.earn * S.jobMul;
  if(age < 65 && S.style === 'work' && !S.retired) v += S.extra;
  if(age >= 65 && S.flags.house) v += 3e5;
  if(S.flags.condo) v += 4.5e5;
  return v;
}
const feeRate = () => S.skill.trade ? 0 : .001;
const loanRate = () => S.skill.trade ? .03 : .06;
const valOf = id => S.sh[id] * S.px[id];
const holdTotal = () => AIDS.reduce((s, id) => s + valOf(id), 0);
const total = () => S.cash + holdTotal();
const power = () => S.margin ? Math.max(0, S.cash + total()) : Math.max(0, S.cash);
const fireNeed = () => Math.max(0, (END_AGE - S.age) * 1.5e6 * .7);
const canFire = () => S && !S.over && S.style !== 'fire' && S.age < END_AGE && total() >= fireNeed();
function curWeights(){ const E = Math.max(total(), 1), w = {}; for(const id of AIDS) w[id] = Math.max(0, valOf(id) / E); return w; }
function spend(x){ const amt = Math.min(x, Math.max(0, total()) * .5); S.cash -= amt; return amt; }
function spendPct(p){ const amt = Math.max(0, total()) * p; S.cash -= amt; return amt; }
function logT(key, p){ news('sys', tr(key, p)); }

/* 出来事を毎回ランダムに生成 */
function scheduleYear(age){
  const ev = [], r = Math.random(), M = modeById(S.mode), seasons = activeSeasons();
  const mult = [M.eventWeights, ...seasons.map(s => s.weights)];
  const scale = fx => { const o = {}; for(const id in fx){ const a = assetById(id); if(a) o[id] = fx[id] * a.ev; } return o; };
  const nMajor = r < .35 ? 0 : r < .85 ? 1 : 2;
  for(let i=0;i<nMajor;i++){
    const d = weightedPick(CONST_EVENTS, mult), Mg = .12 + Math.random()*.38;
    const f = Math.random() < .2 ? (-.6 + Math.random()*.9) : 1; // 2割は見出しと違う動き
    const s = scale(d.fx), fx = {}; for(const id in s) fx[id] = s[id] * Mg * f;
    ev.push({tk:rint(3,50), kind:'hist', id:d.id, p:rint(0,7), imp:d.fx, fx, real:true});
  }
  const nR = rint(0, 2);
  for(let i=0;i<nR;i++){
    const d = weightedPick(CONST_RUMORS, mult), m = .1 + Math.random()*.15;
    const s = scale(d.fx), fx = {}; for(const id in s) fx[id] = s[id] * m;
    ev.push({tk:rint(3,50), kind:'rumor', id:d.id, p:rint(0,7), imp:d.fx, fx, real:Math.random() < .7});
  }
  for(const sc of [...(M.scripted||[]), ...seasons.flatMap(s => s.scripted||[])]){
    if(sc.age !== age) continue;
    ev.push({tk:rint(8,40), kind:sc.kind || 'hist', custom:sc.text, p:rint(0,7), imp:sc.fx, fx:{...sc.fx}, real:sc.real !== false});
  }
  const choice = M.style === 'choice';
  for(const L of CONST_LIFE){
    if(age>=L.min && age<=L.max && !(L.once && S.lifeDone[L.id]) && (!L.when || L.when(S, choice)) && Math.random() < L.p){
      ev.push({tk:rint(5,55), kind:'life', id:L.id, cost:L.cost * (L.id==='sick' && age>=60 ? 2 : 1)});
      if(L.once) S.lifeDone[L.id] = 1;
    }
  }
  return ev;
}
const findDef = ev => (ev.kind==='hist' ? CONST_EVENTS : CONST_RUMORS).find(d => d.id===ev.id);
const evText = ev => (ev.custom ? txt(ev.custom) : txt((findDef(ev) || {}).text)).replace('{p}', D().places[ev.p || 0]);
const arrow = x => x > .02 ? '▲' : x < -.02 ? '▼' : '→';
function moversText(fx, n = 3, withSize){
  return Object.entries(fx).filter(([, v]) => Math.abs(v) >= .03).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, n)
    .map(([id, v]) => txt(assetById(id).short) + arrow(v) + (withSize && Math.abs(v) >= .25 ? tr('big') : '')).join(' ') || tr('none');
}
// 分析力：Lv1＝いちばん動く投資先、Lv2＝上位3つ、Lv3＝すべて＋大きさ。噂は真偽の見抜き率UP
function analysis(ev){
  const L = S.skill.ana; if(!L) return '';
  let s = tr('ana', {l:L, p:moversText(ev.fx, L===1 ? 1 : L===2 ? 3 : 5, L>=3)});
  if(ev.kind === 'rumor'){
    const right = Math.random() < Math.min(.95, .55 + .15*L);
    s += tr('cred', {v: (ev.real === right) ? tr('credHi') : tr('credLo')});
  }
  return s;
}

/* ==================== シミュレーション ==================== */
function step(){
  S.t++; S.tick++;
  const m = gauss(), r = {};
  for(const a of CONST_ASSETS) r[a.id] = a.mu/TPY + a.sig/Math.sqrt(TPY)*(.4*m + .92*gauss());
  for(const p of S.pending){
    if(S.t === p.s){
      if(p.real) news('flash', tr('reactL') + moversText(p.raw, 4));
      else news('fake', tr('fake', {t:evText(p.ev)}));
    }
    if(S.t >= p.s && S.t < p.e) for(const id in p.fx) r[id] += p.fx[id] / (p.e - p.s);
  }
  S.pending = S.pending.filter(p => S.t < p.e);
  for(const id of AIDS) S.px[id] = Math.max(.5, S.px[id] * Math.exp(r[id]));
  S.cash *= 1 + (S.cash >= 0 ? .005 : loanRate()) / TPY;
  S.cash += income(S.age) / TPY;

  // 潔白さ＝人生全体の平均（最初の10年分は中立として加重）
  const E = Math.max(total(), 1); let ks = 0;
  for(const a of CONST_ASSETS) ks += clamp(valOf(a.id) / E, 0, 2) * a.k;
  S.kAcc += clamp(ks, -1, 1); S.kN++;
  S.karma = clamp(50 + (S.kBias||0) + 50 * S.kAcc / (S.kN + 10*TPY), 0, 100);

  for(const ev of S.sched){
    if(ev.tk !== S.tick) continue;
    if(ev.kind === 'life'){
      const cost = ev.cost > 0 ? Math.min(ev.cost, Math.max(0, total()) * .5) : ev.cost;
      S.cash -= cost;
      if(ev.id === 'lotto') S.lotto = true;
      news('life', `${txt((CONST_LIFE.find(l => l.id===ev.id) || {}).text)} ${cost>0?'−':'+'}${money(Math.abs(cost))}`);
    } else {
      const d = ev.kind==='hist' ? rint(8,16) : rint(6,12), dur = rint(14,28), lf = {};
      for(const id in ev.fx){ const v = Math.log(1 + clamp(ev.fx[id], -.9, 3)); lf[id] = ev.real ? v : -.3 * v; }
      S.pending.push({s:S.t+d, e:S.t+d+dur, real:ev.real, ev:{kind:ev.kind, id:ev.id, p:ev.p, custom:ev.custom}, fx:lf, raw:ev.fx});
      const hint = analysis(ev);
      news(ev.kind, evText(ev) + (hint ? '\n' + hint : ''));
      if(S.auto && !isChoice()) autoTrade(ev);
      if(isChoice() && S.style === 'invest' && ev.kind === 'hist' && !S.ff && Math.max(...Object.values(ev.imp).map(Math.abs)) >= .5 && Math.random() < .45)
        queueChoice({type:'news', ev:{kind:ev.kind, id:ev.id, p:ev.p, custom:ev.custom, imp:ev.imp, fx:ev.fx, real:ev.real}});
    }
    S.marks.push({t:S.t, k:ev.kind});
  }

  let T = total();
  if(T <= 0){
    const b = mode().bankrupt;
    if(b === 'end'){ pushHist(T); finish(true); return; }
    bankruptRescue(b); T = total();
  }
  pushHist(T);
  if(S.tick >= TPY) yearEnd(T);
}
function pushHist(T){
  S.peak = Math.max(S.peak, T);
  for(const id of AIDS) S.hp[id].push(Math.round(S.px[id]*100)/100);
  S.hT.push(Math.round(T));
}
function bankruptRescue(b){
  for(const id of AIDS){ S.sh[id] = 0; S.cost[id] = 0; }
  S.margin = false;
  let base;
  if(b === 'insure'){ S.insured++; base = Math.max(1e5, (S.yearStart||0) * .5); news('sys', tr('insured', {v:money(base), n:S.insured})); }
  else { S.restarts++; base = 5e5; news('sys', tr('restart', {v:money(base), n:S.restarts})); }
  S.cash = base;
  if(S.age < 65 && (S.style !== 'work' || S.retired)){ S.retired = 0; if(S.style==='fire') S.style = 'invest'; setStyle('work', true); logT('forcedWork'); }
  else if(S.age >= 65){ S.flags.welfare = 1; logT('welfare'); }
  if(!window.__fast && !S.ff) flash(S.log[0] ? S.log[0].text : '');
}
function yearEnd(T){
  S.tick = 0; S.age++;
  S.yearly.push(Math.round(T)); S.yearlyK.push(Math.round(S.karma*10)/10); S.yearStart = T;
  if(S.age >= END_AGE){ finish(false); return; }
  if(S.style === 'work' && !S.retired){
    const st = route().pay.find(([a]) => a === S.age);
    if(st && S.age !== S.startAge) news('sys', tr('promo', {what:D().promoWhat[S.age>=50?2:S.age>=30?1:0], v:money(income(S.age))}));
  }
  if(S.route === 'high' && (S.age === 30 || S.age === 45)){ S.skill.ana = Math.min(3, S.skill.ana + 1); logT('skillUp', {n:S.skill.ana}); }
  if(S.style === 'invest' && S.investSince != null && S.age > S.investSince && (S.age - S.investSince) % 10 === 0 && S.skill.ana < 3){ S.skill.ana++; logT('skillUp', {n:S.skill.ana}); }
  if(S.flags.careUntil === S.age){ S.jobMul /= .85; S.flags.careUntil = 0; logT('careEnd'); }
  if(S.flags.venture === 1 && S.age === 32){ S.flags.venture = 2; if(Math.random() < .4){ S.cash += 8e6; logT('ipoWin', {v:money(8e6)}); } else logT('ipoLose'); }
  if(S.age === 65 && S.style === 'work' && !S.flags.rehire) logT('retire', {v:money(1.5e6)});
  S.sched = scheduleYear(S.age);
  if((isChoice() || S.style === 'fire') && S.alloc) rebalanceTo(S.alloc);
  if(S.auto && !isChoice() && S.style !== 'fire') autoTrade(null);
  if(isChoice() && !S.ff) checkTurns();
  save();
}

/* ==================== 売買 ==================== */
function rebalanceTo(w){
  const E = total(); if(E <= 0) return;
  let fee = 0, used = 0;
  for(const id of AIDS){
    const tgt = (w[id] || 0) * E, cur = valOf(id);
    fee += Math.abs(tgt - cur) * feeRate();
    if(tgt > cur + 1){ S.cost[id] += tgt - cur; S.boughtAny = true; if(id === 'mil') S.boughtMil = true; }
    else if(cur > 0) S.cost[id] *= tgt / cur;
    S.sh[id] = tgt / S.px[id]; used += tgt;
  }
  S.cash = E - used - fee;
}
function trade(act, id, f){
  if(!ui.running || S.over || isChoice() || S.style === 'fire') return;
  if(act === 'cashall'){ for(const a of AIDS) trade('sell', a, 1); return; }
  if(act === 'buy'){
    const amt = power() * f;
    if(amt < 1){ flash(tr('noPower')); return; }
    S.sh[id] += amt * (1 - feeRate()) / S.px[id]; S.cost[id] += amt; S.cash -= amt;
    S.boughtAny = true; if(id === 'mil') S.boughtMil = true;
  } else {
    if(S.sh[id] <= 0) return;
    const sh = S.sh[id] * f;
    S.cash += sh * S.px[id] * (1 - feeRate()); S.cost[id] *= (1 - f); S.sh[id] -= sh;
    if(f === 1 || S.sh[id] < 1e-9){ S.sh[id] = 0; S.cost[id] = 0; }
  }
  S.manual = (S.manual||0) + 1;
  render(); ui.dirty = true;
}
/* ハードのおまかせ：バランス型を基本に、ニュース（分析力があれば本当の向き）で傾ける */
function autoTrade(ev){

    w[id] = Math.max(0, (base[id] || 0) * (1 + 1.2 * s)); sum += w[id];

/* ==================== 選択肢（人生の節目・配分・働き方・FIRE・ニュース） ==================== */
function checkTurns(){
  for(const T of CONST_TURNS){
    if(S.over || S.ff) return;
    if(S.turnsDone[T.id] || T.age !== S.age) continue;
    if(T.when && !T.when(S)) continue;
    S.turnsDone[T.id] = 1;
    queueChoice({type:'turn', id:T.id});
  }
  if(!S.over && !S.ff && CONST_ALLOC_REVIEWS.includes(S.age)) queueChoice({type:'alloc', reason:'review'});
}
function queueChoice(item){
  if(!S || S.over || S.ff) return;

}
function choiceOptions(item){
  const d = D(), hints = modeById(S.mode).hints;

    const T = turnById(item.id);

  }
  if(item.type === 'alloc'){
    const list = CONST_ALLOCS.map(a => ({id:a.id, t:txt(a.name), d:txt(a.d), alloc:a, cur:S.allocId === a.id}));
    if(S.alloc && item.reason !== 'start') list.unshift({id:'keep', t:tr('allocKeep'), d:tr('allocNow', {a:S.allocId ? txt(allocById(S.allocId).name) : '—'})});
    return list;
  }
  if(item.type === 'style'){
    const o = [];
    if(S.style !== 'work' && S.age < 65) o.push({id:'work', t:S.style === 'invest' ? tr('styleBack') : tr('styleWork'), d:d.styleWorkPts.join(' / ')});
    if(S.style !== 'invest') o.push({id:'invest', t:tr('styleInvest'), d:d.styleInvestPts.join(' / ')});
    o.push({id:'cancel', t:tr('fireCancel'), d:''});
    return o;
  }
  if(item.type === 'fire'){
    return [{id:'safe', t:tr('fireSafe'), d:txt(allocById('safe').d)}, {id:'keep', t:tr('fireKeep'), d:''}, {id:'cancel', t:tr('fireCancel'), d:''}];
  }
  if(item.type === 'news'){
    const best = Object.entries(item.ev.imp).sort((a, b) => b[1] - a[1])[0];
    return [
      {id:'ride', t:tr('newsRide'), d:tr('newsRideD', {a:txt(assetById(best[0]).name)}), hint:''},
      {id:'defend', t:tr('newsDefend'), d:tr('newsDefendD'), hint:''},
      {id:'hold', t:tr('newsHold'), d:tr('newsHoldD'), hint:''},
    ];
  }

}
function resolveChoice(item, optId){
  if(item.type === 'turn'){
    const T = turnById(item.id), o = T.opts.find(x => x.id === optId);
    if(!window.__fast) news('pick', tr('turnPicked', {q:txt(T.q), o:txt(o.t)}));
    o.apply(S);
    if(S.alloc && !S.over) rebalanceTo(S.alloc);
  } else if(item.type === 'alloc'){
    if(optId !== 'keep'){
      const a = allocById(optId); S.alloc = {...a.w}; S.allocId = a.id;
      rebalanceTo(S.alloc);
      if(!window.__fast) logT('allocChanged', {a:txt(a.name)});
    }
  } else if(item.type === 'style'){
    if(optId === 'work'){ if(S.style === 'invest') S.jobMul *= .8; S.retired = 0; setStyle('work'); }
    else if(optId === 'invest') setStyle('invest');
  } else if(item.type === 'fire'){
    if(optId === 'cancel') return;
    if(optId === 'safe'){ S.alloc = {...allocById('safe').w}; S.allocId = 'safe'; }
    else if(!S.alloc || !isChoice()){ S.alloc = curWeights(); S.allocId = null; }
    doFire();
  } else if(item.type === 'news'){
    const E = total(); if(E <= 0) return;
    if(optId === 'ride'){
      const best = Object.entries(item.ev.imp).sort((a, b) => b[1] - a[1])[0][0], w = curWeights();
      for(const id in w) w[id] *= .75; w[best] = (w[best] || 0) + .25; rebalanceTo(w);
    } else if(optId === 'defend'){
      const w = curWeights(); let mv = 0;
      for(const id of ['mil','tech','space']){ mv += (w[id]||0) * .5; w[id] = (w[id]||0) * .5; }
      w.infra = (w.infra||0) + mv/2; w.green = (w.green||0) + mv/2; rebalanceTo(w);
    }

}
function botResolve(item){

    S.alloc = {...allocById(Math.random() < .5 ? 'safe' : 'balance').w}; doFire(); return;
  }
  const opts = choiceOptions(item).filter(o => o.id !== 'cancel' && !o.disabled);

/* ==================== チャート ==================== */
const cv = $('cv'), ctx = cv.getContext('2d');
function fitCanvas(c){
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if(c.width !== Math.round(W*dpr) || c.height !== Math.round(H*dpr)){ c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); }
  const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  return [W, H];
}
function drawChart(){
  const [W, H] = fitCanvas(cv);
  if(!S) return;
  const N = S.hT.length, all = ui.range === 'all';
  const span = all ? Math.max(N-1, TPY) : TPY*3;
  const start = all ? 0 : Math.max(0, N-1-span);
  const L = 8, R = 50, T = 26, B = 18, pw = W-L-R, ph = H-T-B;
  const X = i => L + (i-start)/span*pw;
  const series = ui.mode === 'price'
    ? CONST_ASSETS.map(a => ({d:S.hp[a.id], c:a.color, n:txt(a.short)}))
    : [{d:S.hT, c:COL.T, n:tr('legT'), fill:true}];
  const lg = v => Math.log(Math.max(v, ui.mode === 'price' ? .5 : 1e3));
  let mn = Infinity, mx = -Infinity;
  for(const s of series) for(let i=start;i<N;i++){ const v = lg(s.d[i]); if(v<mn) mn = v; if(v>mx) mx = v; }
  if(mx-mn < .06){ const c = (mx+mn)/2; mn = c-.03; mx = c+.03; }
  const pad = (mx-mn)*.1; mn -= pad; mx += pad;
  const Y = v => T + (1-(lg(v)-mn)/(mx-mn))*ph;
  ctx.font = '600 10px -apple-system,sans-serif'; ctx.textBaseline = 'middle';
  for(let j=0;j<=4;j++){
    const lv = mn+(mx-mn)*j/4, y = T+(1-j/4)*ph, v = Math.exp(lv);
    ctx.strokeStyle = 'rgba(120,140,190,.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke();
    ctx.fillStyle = '#5b6580'; ctx.textAlign = 'left';
    ctx.fillText(ui.mode === 'price' ? (v>=100 ? v.toFixed(0) : v.toFixed(1)) : moneyShort(v), W-R+6, y);
  }
  const yStep = all ? (span > TPY*30 ? 10 : 5) : 1, y0 = yearOf(S.startAge);
  ctx.textAlign = 'center';
  for(let t=Math.ceil(start/TPY)*TPY; t<=start+span; t+=TPY){
    const yr = y0 + t/TPY;
    if(all && (yr - y0) % yStep !== 0) continue;
    const x = X(t);
    ctx.strokeStyle = 'rgba(120,140,190,.12)'; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,T+ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#5b6580'; ctx.fillText(yr, Math.max(16, Math.min(W-R-16, x)), H-8);
  }
  for(const mk of S.marks){
    if(mk.t < start) continue;
    const x = X(mk.t);
    ctx.fillStyle = mk.k === 'hist' ? COL.gold : mk.k === 'life' ? COL.life : COL.rumor;
    ctx.beginPath(); ctx.moveTo(x-3.5,T-6); ctx.lineTo(x+3.5,T-6); ctx.lineTo(x,T); ctx.closePath(); ctx.fill();
  }
  const stp = Math.max(1, Math.floor((N-start)/pw));
  const path = s => { ctx.beginPath(); let first = true; for(let i=start;i<N;i+=stp){ const x = X(i), y = Y(s.d[i]); first ? ctx.moveTo(x,y) : ctx.lineTo(x,y); first = false; } ctx.lineTo(X(N-1), Y(s.d[N-1])); };
  for(const s of series){
    if(s.fill){
      path(s); ctx.lineTo(X(N-1),T+ph); ctx.lineTo(X(start),T+ph); ctx.closePath();
      const g = ctx.createLinearGradient(0,T,0,T+ph); g.addColorStop(0,'rgba(127,178,255,.30)'); g.addColorStop(1,'rgba(127,178,255,0)');
      ctx.fillStyle = g; ctx.fill();
    }
    path(s);
    ctx.strokeStyle = s.c; ctx.lineWidth = series.length > 1 ? 1.6 : 2.2; ctx.lineJoin = 'round'; ctx.stroke();
    const ex = X(N-1), ey = Y(s.d[N-1]);
    ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI*2); ctx.fill();
  }
  if(series.length === 1){
    const s = series[0], ey = Y(s.d[N-1]);
    ctx.fillStyle = s.c; ctx.fillRect(W-R+2, ey-8, R-4, 16);
    ctx.fillStyle = '#0a0d14'; ctx.textAlign = 'center'; ctx.fillText(moneyShort(s.d[N-1]), W-R/2, ey);
  }
  ctx.textAlign = 'left'; let lx = L+2, ly = 10;
  for(const s of series){
    const w = ctx.measureText(s.n).width + 22;
    if(lx + w > W - 160){ lx = L+2; ly += 13; }
    ctx.fillStyle = s.c; ctx.fillRect(lx, ly-1, 9, 3); ctx.fillStyle = '#aab3c8'; ctx.fillText(s.n, lx+12, ly);
    lx += w;
  }
}
function drawResultChart(){
  const c = $('rcv'); if(!c || !S) return;
  const [W, H] = fitCanvas(c), x = c.getContext('2d');
  const d = S.yearly.concat([Math.round(total())]), kd = S.yearlyK.concat([S.karma]), n = d.length;
  const L = 40, R = 30, T = 26, B = 20, pw = W-L-R, ph = H-T-B;
  const lg = v => Math.log10(Math.max(v, 1e4));
  let mn = Math.min(...d.map(lg)), mx = Math.max(...d.map(lg)); if(mx-mn < .5){ mx += .25; mn -= .25; }
  const X = i => L + i/(n-1||1)*pw, Ya = v => T + (1-(lg(v)-mn)/(mx-mn))*ph, Yk = k => T + (1-k/100)*ph;
  x.font = '600 10px -apple-system,sans-serif'; x.textBaseline = 'middle';
  for(let j=0;j<=2;j++){
    const y = T + j*ph/2;
    x.strokeStyle = 'rgba(120,140,190,.12)'; x.beginPath(); x.moveTo(L,y); x.lineTo(W-R,y); x.stroke();
    x.fillStyle = COL.gold; x.textAlign = 'right'; x.fillText(moneyShort(Math.pow(10, mx - (mx-mn)*j/2)), L-4, y);
    x.fillStyle = COL.K; x.textAlign = 'left'; x.fillText(String(100 - j*50), W-R+4, y);
  }
  x.fillStyle = '#5b6580'; x.textAlign = 'left'; x.fillText(String(yearOf(S.startAge)), L, H-8);
  x.textAlign = 'right'; x.fillText(String(yearOf(S.age)), W-R, H-8);
  if(S.fireAge){ const fx = X(S.fireAge - S.startAge); x.strokeStyle = '#ff9a3c'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(fx,T); x.lineTo(fx,T+ph); x.stroke(); x.setLineDash([]); x.fillStyle = '#ff9a3c'; x.textAlign = 'center'; x.fillText('FIRE', fx, T-6); }
  x.beginPath(); kd.forEach((v,i) => i ? x.lineTo(X(i),Yk(v)) : x.moveTo(X(i),Yk(v)));
  x.setLineDash([4,3]); x.strokeStyle = COL.K; x.lineWidth = 2; x.stroke(); x.setLineDash([]);
  x.beginPath(); d.forEach((v,i) => i ? x.lineTo(X(i),Ya(v)) : x.moveTo(X(i),Ya(v)));
  x.strokeStyle = COL.gold; x.lineWidth = 2.5; x.stroke();
  x.textAlign = 'left'; x.fillStyle = COL.gold; x.fillRect(L, 10, 12, 3); x.fillText(tr('chartAssets'), L+16, 12);
  const w1 = x.measureText(tr('chartAssets')).width;
  x.fillStyle = COL.K; x.fillRect(L+30+w1, 10, 12, 3); x.fillText(tr('chartKarma'), L+46+w1, 12);
}

function finish(bankrupt){
  S.over = true; S.bankrupt = bankrupt; ui.running = false; S.queue = [];
  if(window.__fast) return;
  S.ff = false;
  S.final = judge();
  clearSave(); render(); ui.dirty = true;

function evaluate(){
  const T = total(), k = kIdx(S.karma), t = S.bankrupt ? 0 : tierOf(T, k);
  return {T, t, k};
}
function judge(){
  const r = evaluate(), rare = RARE[r.t + '-' + r.k];
  r.base = r.t + '-' + r.k;
  if(rare){ r.trial = rare; r.won = Math.random() < rare.q; if(!r.won) [r.t, r.k] = rare.fb.split('-').map(Number); }
  r.key = r.t + '-' + r.k;
  r.rarity = rarityOf(r.key);
  return r;
}
function recordDex(r){
  const d = loadDex(), e = d[r.key];
  d[r.key] = { n:(e ? e.n : 0) + 1, best: Math.max(e ? e.best : -Infinity, Math.round(r.T)) };
  saveDex(d);
  return { isNew: !e, count: dexCount(d) };
}

function recordSpecials(r){
  const got = loadJSON(SP_KEY, {}), c = ctxOf(r), out = [];
  for(const sp of CONST_TITLES.special) if(safeCheck(sp.check, c)){ out.push({id:sp.id, isNew:!got[sp.id]}); got[sp.id] = (got[sp.id]||0) + 1; }

}

  else el.innerHTML = `<div class="dimg">${charSVG(t,k,true)}</div><div><small>No.${titleNo(t,k)}・${L.arch[k]}</small><b>${escapeHtml(L.titles[t][k])}</b><small>${rateLine}</small><p>${tr('notYet')}</p><small>${cond}</small></div>`;
}
$('dexGrid').addEventListener('click', e => { const b = e.target.closest('[data-dex]'); if(b) dexDetail(b.dataset.dex); });
$('dexSp').addEventListener('click', e => {
  const b = e.target.closest('[data-sp]'); if(!b) return;
  const s = spById(b.dataset.sp), n = loadJSON(SP_KEY, {})[s.id];
  $('dexDetail').innerHTML = `<div class="dimg">${charSVG(s.art[0], s.art[1], !n)}</div><div><small>${tr('spTitle')}</small><b>${n ? escapeHtml(txt(s.name)) : '？？？'}</b><p>${escapeHtml(txt(s.desc))}</p></div>`;
  $('dexDetail').scrollIntoView({behavior:'smooth', block:'center'});
});
$('dexClose').onclick = () => { $('dexScr').classList.add('hidden'); ui.dexOpen = false; };
$('btnDex').onclick = () => showDex();

/* ==================== 実績・歴代記録・用語・メニュー ==================== */
function showAch(){
  const un = loadJSON(ACH_KEY, {}), N = CONST_ACHIEVEMENTS.length, n = CONST_ACHIEVEMENTS.filter(a => un[a.id]).length;
  $('subPanel').innerHTML = `<div class="dexhead"><b>${tr('achTitle')}</b><span>${tr('achRate', {n, N, p:Math.floor(n/N*100)})}</span><button class="xclose" data-close>✕</button></div>
    <div class="pbar"><i style="width:${n/N*100}%"></i></div>
    <div class="achgrid">${CONST_ACHIEVEMENTS.map(a => `<div class="ach ${un[a.id]?'on':''}"><div class="ai">${a.icon}</div><b>${escapeHtml(txt(a.name))}</b><small>${escapeHtml(txt(a.desc))}</small><small>${un[a.id] ? '✔ ' + un[a.id] : tr('achLocked')}</small></div>`).join('')}</div>`;
  $('subScr').classList.remove('hidden'); $('subScr').scrollTop = 0; ui.sub = 'ach';
}
function showHist(){
  const recs = loadJSON(HIST_KEY, []), L = D();
  $('subPanel').innerHTML = `<div class="dexhead"><b>${tr('histTitle')}</b><button class="xclose" data-close>✕</button></div><div class="note" style="text-align:left">${tr('histNote')}</div>`
    + (recs.length ? `<ul class="hist">${recs.map(x => { const [t,k] = x.key.split('-').map(Number);
        return `<li><div class="hi">${charSVG(t,k)}</div><div><b>${escapeHtml(L.titles[t][k])} ${x.rarity !== 'N' ? `<span class="rar r-${x.rarity}">${x.rarity}</span>` : ''}</b>
        <small>${money(x.T)} ・ ${L.klbl[kIdx(x.karma)]} ${x.karma} ・ ${x.bankrupt ? tr('bankruptAt', {age:x.age, y:x.y0 + x.age - START_AGE}) : x.fire ? tr('resFire', {age:x.fire}) : tr('retired', {y:x.y0 + END_AGE - START_AGE})}</small>
        <small>${escapeHtml(L.routeNames[x.route] || x.route)} ・ ${escapeHtml(txt(modeById(x.mode).name))} ・ ${x.d} ・ v${x.v}</small></div></li>`; }).join('')}</ul>`
      : `<div class="dhint" style="margin-top:20px">${tr('histEmpty')}</div>`);
  $('subScr').classList.remove('hidden'); $('subScr').scrollTop = 0; ui.sub = 'hist';
}
function closeSub(){ $('subScr').classList.add('hidden'); ui.sub = null; }
function showHelp(id){
  $('helpPanel').innerHTML = `<div class="dexhead"><b>${tr('glossTitle')}</b><button class="xclose" data-closehelp>✕</button></div><dl class="gl">`
    + CONST_GLOSSARY.map(g => `<dt id="gl_${g.id}" class="${g.id === id ? 'hl' : ''}">${escapeHtml(txt(g.term))}</dt><dd>${escapeHtml(txt(g.desc))}</dd>`).join('') + `</dl>`
    + `<button class="bigbtn ghost" data-closehelp>${tr('btnClose')}</button>`;
  $('helpScr').classList.remove('hidden');
  ui.helpWasPaused = ui.paused; ui.paused = true; if(S) render();
  ui.help = id;
  requestAnimationFrame(() => { const el = $('gl_' + id); if(el) el.scrollIntoView({block:'start'}); });
}
function closeHelp(){ $('helpScr').classList.add('hidden'); ui.help = null; if(S && ui.running && !(S.queue && S.queue.length)){ ui.paused = ui.helpWasPaused; render(); } }
function showMenu(){
  const choice = S && isChoice(), live = S && ui.running && !S.over && S.style !== 'fire';
  $('menuPanel').innerHTML = `<div class="dexhead"><b>${tr('menuTitle')}</b><button class="xclose" data-closemenu>✕</button></div>`
    + (choice && live ? `<button data-menu="alloc">${tr('btnAlloc')}</button>` : '')
    + (live ? `<button data-menu="style">${tr('btnStyle')}</button><button data-menu="fire" ${canFire() ? '' : 'disabled'}>${tr('btnFire')}　<small>${canFire() ? tr('fireReady') : tr('fireNeed', {v:money(Math.max(0, fireNeed() - total()))})}</small></button>` : '')
    + `<button data-menu="help">${tr('btnHelp')}</button><button data-menu="dex">${tr('dexBtn', {n:dexCount(loadDex())})}</button><button data-menu="ach">${tr('achTitle')}</button><button data-menu="hist">${tr('histTitle')}</button><button data-menu="fb">${tr('feedbackBtn')}</button><button data-menu="title">${tr('btnTitle')}</button>`;
  $('menuScr').classList.remove('hidden');
  ui.menuWasPaused = ui.paused; ui.paused = true; if(S) render();
}
function closeMenu(resume = true){ $('menuScr').classList.add('hidden'); if(resume && S && ui.running && !(S.queue && S.queue.length)){ ui.paused = ui.menuWasPaused; render(); } }
$('menuScr').addEventListener('click', e => {
  if(e.target.closest('[data-closemenu]')){ closeMenu(); return; }
  const b = e.target.closest('[data-menu]'); if(!b) return;
  const m = b.dataset.menu;
  closeMenu(!['alloc','style','fire'].includes(m));
  if(m === 'alloc' || m === 'style' || m === 'fire') openSub(m);
  else if(m === 'help') showHelp('karma');
  else if(m === 'dex') showDex();
  else if(m === 'ach') showAch();
  else if(m === 'hist') showHist();
  else if(m === 'fb') showFeedback();
  else if(m === 'title'){ save(); ui.running = false; ui.paused = true; showTitle(); }
});

/* ==================== 意見を送る ==================== */
function showFeedback(){
  const d = D();
  $('fbPanel').innerHTML = `<div class="rh2" style="margin-bottom:6px">${tr('fbTitle')}</div><div class="tag" style="margin:0">${tr('fbIntro')}</div>
    <label>${tr('fbCat')}</label><select id="fbCat">${d.fbCats.map((c,i) => `<option value="${i}">${c}</option>`).join('')}</select>
    <label>${tr('fbMsg')}</label><textarea id="fbMsg" maxlength="2000" placeholder="${tr('fbMsgPh')}"></textarea>
    <label>${tr('fbContact')}</label><input type="text" id="fbContact" maxlength="200">
    <label class="chk"><input type="checkbox" id="fbAttach" checked> ${tr('fbAttach')}</label>
    <div class="note" style="text-align:left">${tr('fbNote')}</div>
    <div class="row2"><button class="bigbtn ghost" id="fbCancel">${tr('fbCancel')}</button><button class="bigbtn primary" id="fbSend">${tr('fbSend')}</button></div>`;
  $('fbScr').classList.remove('hidden');
  ui.fbWasPaused = ui.paused; ui.paused = true; if(S) render();
  $('fbCancel').onclick = closeFeedback;
  $('fbSend').onclick = sendFeedback;
}
function closeFeedback(){ $('fbScr').classList.add('hidden'); if(S && ui.running && !(S.queue && S.queue.length)){ ui.paused = ui.fbWasPaused; render(); } }
function feedbackMeta(){
  const m = [`v${VERSION}`, `lang:${LANG}`, `ua:${navigator.userAgent.slice(0,120)}`];
  if($('fbAttach') && $('fbAttach').checked && S){
    m.push(`mode:${S.mode}`, `route:${S.route}`, `style:${S.style}`, `age:${S.age}`, `assets:${Math.round(total())}`, `karma:${Math.round(S.karma)}`);
    if(S.final) m.push(`title:${S.final.key}`, `rarity:${S.final.rarity}`);
  }
  return m.join(' / ');
}
function sendFeedback(){
  const msg = $('fbMsg').value.trim();
  if(!msg){ flash(tr('fbEmpty')); return; }
  const cat = D().fbCats[+$('fbCat').value], contact = $('fbContact').value.trim(), meta = feedbackMeta();
  const body = `[${cat}]\n${msg}\n\n${contact ? 'contact: ' + contact + '\n' : ''}${meta}`;
  if(FEEDBACK_FORM){
    const url = FEEDBACK_FORM.replace('{category}', encodeURIComponent(cat)).replace('{message}', encodeURIComponent(msg)).replace('{contact}', encodeURIComponent(contact)).replace('{meta}', encodeURIComponent(meta));
    window.open(url, '_blank', 'noopener'); flash(tr('fbOpened')); closeFeedback();
  } else if(FEEDBACK_EMAIL){
    location.href = `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent('[HISTORY TRADER] ' + cat)}&body=${encodeURIComponent(body)}`;
    flash(tr('fbOpened')); closeFeedback();
  } else {
    const done = () => { flash(tr('fbCopied')); closeFeedback(); };
    if(navigator.clipboard) navigator.clipboard.writeText(body).then(done, done); else done();
  }
}

/* ==================== 言語 ==================== */
function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hans' : LANG;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = tr(el.dataset.i); });
  $('langRow').innerHTML = Object.entries(LANGS).map(([c, n]) => `<button data-lang="${c}" class="${c===LANG?'on':''}">${n}</button>`).join('');
  $('langSel').innerHTML = Object.entries(LANGS).map(([c, n]) => `<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('');
  $('tagLine').innerHTML = tr('tag');
  $('rulesList').innerHTML = D().rules.map(r => `<li>${r}</li>`).join('');
  $('btnAuto').title = tr('autoChip');
  $('verTitle').textContent = $('verGame').textContent = 'v' + VERSION;
  $('chlogBody').innerHTML = CONST_CHANGELOG.map(c => `<p><b>v${c.v}</b>（${c.date}）<br>${escapeHtml(txt(c.text))}</p>`).join('');
  refreshTitleButtons();
  if(!ui.running) $('tickerText').textContent = tr('tickerInit');
  ui.chipKey = ui.avatar = ui.rowsKey = ui.actKey = null;
  if(S) render();
  ui.dirty = true;
  if(!$('setupScr').classList.contains('hidden')) showSetup(ui.setupStep || 'mode');
  if(!$('dexScr').classList.contains('hidden')) showDex(typeof ui.dexOpen === 'string' ? ui.dexOpen : undefined);
  if(!$('resultScr').classList.contains('hidden') && S && S.final) showResult();
  if(!$('fbScr').classList.contains('hidden')) showFeedback();
  if(!$('choiceScr').classList.contains('hidden') && S && S.queue && S.queue.length) showChoice();
  if(ui.sub === 'ach') showAch(); else if(ui.sub === 'hist') showHist();
  if(ui.help) showHelp(ui.help);
}
function setLang(c){ if(!I18N[c]) return; LANG = c; try{ localStorage.setItem(LANG_KEY, c); }catch(e){} applyLang(); }
function refreshTitleButtons(){
  $('btnDex').textContent = tr('dexBtn', {n:dexCount(loadDex())});
  const un = loadJSON(ACH_KEY, {});
  $('btnAch').textContent = tr('achBtn', {n:CONST_ACHIEVEMENTS.filter(a => un[a.id]).length, N:CONST_ACHIEVEMENTS.length});
  const sv = loadSave(), bc = $('btnContinue');
  if(sv){ bc.classList.remove('hidden'); bc.textContent = tr('continue', {age:sv.age, year:sv.y0 + sv.age - START_AGE}); $('btnNew').className = 'bigbtn ghost'; }
  else { bc.classList.add('hidden'); $('btnNew').className = 'bigbtn primary'; }
}
function showTitle(){ refreshTitleButtons(); hideOverlays(); $('titleScr').classList.remove('hidden'); }

/* ==================== ループ ==================== */
let last = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = last ? Math.min(ts - last, 250) : 0; last = ts;
  if(S && ui.running && !ui.paused && !S.over && !(S.queue && S.queue.length)){
    acc += dt;
    const iv = BASE_MS / S.speed; let n = 0;
    while(acc >= iv && n < 16 && !S.over && !(S.queue && S.queue.length)){ acc -= iv; step(); n++; }
    if(n){ render(); ui.dirty = true; }
    if(!S.over) $('yearFill').style.width = ((S.tick + acc/iv)/TPY*100) + '%';
  }
  if(S && (ui.dirty || (ui.running && !ui.paused))){ drawChart(); ui.dirty = false; }
}

/* ==================== 操作 ==================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(b){ trade(b.dataset.act, b.dataset.k, ui.amt); return; }
  const am = e.target.closest('[data-amt]');
  if(am){ ui.amt = +am.dataset.amt; ui.rowsKey = null; render(); return; }
  const s = e.target.closest('.spd');
  if(s && S){ S.speed = +s.dataset.s; if(!(S.queue && S.queue.length)) ui.paused = false; render(); return; }
  const m = e.target.closest('[data-m]');
  if(m){ ui.mode = m.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === m)); ui.dirty = true; return; }
  const r = e.target.closest('[data-r]');
  if(r){ ui.range = r.dataset.r; document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x === r)); ui.dirty = true; return; }
  const lb = e.target.closest('[data-lang]');
  if(lb){ setLang(lb.dataset.lang); return; }
  const hp = e.target.closest('[data-help]');
  if(hp){ e.preventDefault(); showHelp(hp.dataset.help); return; }
  if(e.target.closest('[data-closehelp]')){ closeHelp(); return; }
  if(e.target.closest('[data-fb]')){ showFeedback(); return; }
  const op = e.target.closest('[data-open]');
  if(op){ op.dataset.open === 'ach' ? showAch() : showHist(); return; }
  if(e.target.closest('[data-close]')){ closeSub(); return; }
  const sb = e.target.closest('#acts [data-sub]');
  if(sb){ openSub(sb.dataset.sub); return; }
});
$('langSel').onchange = e => setLang(e.target.value);
$('btnMenu').onclick = () => showMenu();
$('btnPause').onclick = () => { if(!S || S.over || !ui.running || (S.queue && S.queue.length)) return; ui.paused = !ui.paused; if(ui.paused) save(); render(); };
$('btnAuto').onclick = () => { if(S && ui.running && !S.over) setAuto(!S.auto); };
$('margin').onchange = e => {
  if(!S || S.over || S.auto || isChoice()){ e.target.checked = !!(S && S.margin); return; }
  S.margin = e.target.checked;
  if(S.margin){ S.marginEver = true; flash(tr('marginOn', {r:loanRate()*100})); }
  render();
};
$('btnNew').onclick = () => { if(loadSave() && !confirm(tr('confirmNew'))) return; clearSave(); showSetup('mode'); };
$('btnContinue').onclick = () => { const sv = loadSave(); if(sv){ S = sv; startGame(true); } };
document.addEventListener('visibilitychange', () => { if(document.hidden && S && ui.running){ ui.paused = true; save(); render(); } });
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { ui.dirty = true; });

newState(); ui.running = false;
applyLang(); render();
showTitle();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
