     下の「https://capital-and-soul.github.io/」を公開URLに置き換えてください（og:image は絶対URL必須）。 -->

<meta name="twitter:image" content="https://capital-and-soul.github.io/ogp.png">

<style>
:root{
  --bg:#090c13; --panel:#111725; --panel2:#161e30; --line:#232d45; --text:#e8ecf5; --sub:#8b95ad; --dim:#5b6580;
  --A:#ff5d4f; --B:#2fd89c; --C:#7fb2ff; --gold:#f5c451; --purple:#b48cff; --danger:#ff4d6d;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans SC","Noto Sans KR","Yu Gothic UI","Malgun Gothic","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#1a2340 0%,var(--bg) 60%) fixed}
button,select,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
#game{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 16px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.when{display:flex;align-items:baseline;gap:8px;min-width:0}
.age{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.age small{font-size:12px;color:var(--sub);margin-left:2px;font-weight:600}
.year{font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap}
.ctrl{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.cbtn{border:0;background:transparent;border-radius:9px;min-width:36px;height:34px;font-size:13px;font-weight:700;color:var(--sub);padding:0 6px}
.cbtn.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #34405f}
#btnPause{font-size:15px;color:var(--text)}
#btnPause.paused{background:var(--gold);color:#1a1300}
#btnAuto{font-size:15px}
#btnAuto.on{background:linear-gradient(135deg,#7d5cff,#4f7cff);color:#fff;box-shadow:0 0 12px rgba(125,92,255,.6)}

.yearbar{position:relative;height:18px;margin:8px 0 6px;background:var(--panel);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
#yearFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#2a3866,#4460b0)}
.yearbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:10.5px;color:#c9d3ec;font-weight:600}
.skills{display:flex;flex-wrap:wrap;gap:4px;margin:-2px 0 6px}
.skills span{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:#c7cfe2}
.skills span.off{color:var(--dim)}
.skills span.autoc{background:linear-gradient(135deg,#3a2a7a,#23366e);border-color:#7d5cff;color:#fff}

/* ticker */
.ticker{display:flex;align-items:center;height:30px;background:#0d1220;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tlabel{flex:none;height:100%;display:flex;align-items:center;padding:0 8px;background:var(--danger);color:#fff;font-size:10px;font-weight:900;letter-spacing:1px}
.tview{flex:1;overflow:hidden;white-space:nowrap}
#tickerText{display:inline-block;padding-left:100%;font-size:13px;font-weight:600;animation:mq 16s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* chart */
.chartbox{position:relative;margin-top:8px;background:linear-gradient(180deg,#0f1524,#0b101b);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ctabs{position:absolute;top:6px;right:6px;display:flex;gap:3px;z-index:2}
.ctabs button{border:1px solid var(--line);background:rgba(17,23,37,.85);color:var(--sub);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px}
.ctabs button.on{color:var(--text);border-color:#4a5a85}
.ctabs .sp{width:4px}
#cv{display:block;width:100%;height:210px}
#toast{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 11px;border-radius:11px;background:rgba(14,19,32,.94);border:1px solid #33405f;font-size:12.5px;line-height:1.45;font-weight:600;transform:translateY(130%);opacity:0;transition:.3s;pointer-events:none;backdrop-filter:blur(6px);white-space:pre-line}
#toast.show{transform:none;opacity:1}
.badge{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.k-hist{background:var(--gold);color:#241a00}.k-rumor{background:#4c6fd6;color:#fff}.k-life{background:var(--purple);color:#1d0f3a}
.k-flash{background:var(--danger);color:#fff}.k-fake{background:#566079;color:#fff}.k-sys{background:#2b3a5c;color:#cfe}
.k-auto{background:linear-gradient(135deg,#7d5cff,#4f7cff);color:#fff}

/* summary */
.summary{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:8px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
.sbox label{display:block;font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.5px}
#total{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
#totalChg{font-size:11px;font-weight:700;color:var(--sub)}
.kbar{height:8px;border-radius:4px;margin:7px 0 4px;background:linear-gradient(90deg,#1b1b1f,#5b6070 50%,#f2f5ff);position:relative}
#karmaMark{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px var(--gold);transform:translateX(-2px);transition:left .2s}
#karmaLbl{font-size:12px;font-weight:700}
#karmaV{font-size:15px;color:var(--text);margin-left:4px}
.sbox.kb{position:relative;padding-right:52px}
.avatar{position:absolute;right:7px;top:7px;width:40px;border-radius:8px;overflow:hidden;border:1px solid #3a4870}

/* asset cards */
.card{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.card.a{--c:var(--A)}.card.b{--c:var(--B)}.card.c{--c:var(--C)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cname{font-size:14px;font-weight:800}
.cname small{display:block;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px}
.cname i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;box-shadow:0 0 8px var(--c);vertical-align:1px}
.cprice{text-align:right;flex:none}
.cprice b{display:block;font-size:16px;font-weight:800}
.cprice span{font-size:11px;font-weight:700}
.chold{font-size:12px;color:var(--sub);margin:6px 0 8px;display:flex;justify-content:space-between}
.chold b{color:var(--text);font-size:14px}
.up{color:var(--B)}.down{color:var(--A)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btns button,.btns2 button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:800;line-height:1.15;padding:0 2px}
.btns button.buy{background:color-mix(in srgb,var(--c) 20%,var(--panel2));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.btns button:active,.btns2 button:active{transform:scale(.96)}
.btns button:disabled,.btns2 button:disabled{opacity:.35}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sw{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:800}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:10px;background:#2a3350;position:relative;margin:0;transition:.2s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cbd3ea;transition:.2s}
.sw input:checked{background:var(--danger)}
.sw input:checked::after{left:18px;background:#fff}
.flow{font-size:11.5px;color:var(--sub);margin-top:7px;display:flex;justify-content:space-between}

details.log{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px}
details.log summary{font-size:12px;font-weight:800;color:var(--sub);cursor:pointer}
#log{list-style:none;margin:6px 0 0;padding:0;max-height:200px;overflow:auto}
#log li{font-size:11.5px;line-height:1.45;padding:5px 0;border-top:1px dashed var(--line);color:#c7cfe2;white-space:pre-line}
#log li em{font-style:normal;color:var(--dim);margin-right:6px}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
.langsel{display:flex;align-items:center;gap:6px;font-weight:700}
.langsel select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px}
.linkbtn{background:none;border:0;color:var(--C);font-weight:800;font-size:12.5px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,12,.82);backdrop-filter:blur(8px);overflow:auto}
.hidden{display:none!important}
.panel{width:100%;max-width:420px;background:linear-gradient(180deg,#141b2c,#0d121e);border:1px solid #2c3858;border-radius:20px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.langs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--sub)}
.langs button.on{border-color:var(--gold);color:var(--gold)}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.1;background:linear-gradient(90deg,var(--A),var(--gold) 50%,var(--B));-webkit-background-clip:text;background-clip:text;color:transparent}
.appsub{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-top:4px}
.tag{color:var(--sub);font-size:13px;margin:8px 0 16px;line-height:1.6}
.rules{font-size:12.5px;line-height:1.7;color:#c7cfe2;padding-left:18px;margin:0 0 18px}
.rules b{color:var(--text)}
.bigbtn{display:block;width:100%;min-height:52px;border-radius:14px;border:0;font-size:16px;font-weight:900;margin-top:10px;padding:8px}
.primary{background:linear-gradient(90deg,#4f7cff,#7d5cff);color:#fff;box-shadow:0 8px 24px rgba(90,100,255,.35)}
.ghost{background:var(--panel2);border:1px solid #33405f!important}
.xbtn{background:#000;color:#fff;border:1px solid #444!important}
.note{font-size:11px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.5}
.center{text-align:center}

/* setup (mode / route) */
#setupScr{z-index:52}
.rq{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:1px}
.rh2{font-size:24px;font-weight:900;margin:4px 0 14px}
.rcard{display:block;width:100%;text-align:left;border:1px solid #33405f;background:#0f1525;border-radius:16px;padding:14px;margin-top:10px;position:relative}
.rcard:active{transform:scale(.98)}
.rcard b{display:block;font-size:17px;font-weight:900;padding-right:96px}
.rcard .rsub{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:2px}
.rcard ul{margin:8px 0 0;padding-left:18px;font-size:12px;line-height:1.65;color:#c7cfe2}
.rcard li.minus{color:#ff9a8f}
.rcard .rtag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;max-width:110px;text-align:center}
.rcard.blue{border-color:#4a6aa8}.rcard.blue .rtag{background:var(--C);color:#0a1020}
.rcard.gold{border-color:#8a6a20}.rcard.gold .rtag{background:var(--gold);color:#2a1c00}
.rcard.red{border-color:#8a3040}.rcard.red .rtag{background:var(--danger);color:#fff}
.rcard.green{border-color:#2a7a5a}.rcard.green .rtag{background:var(--B);color:#062a1c}
.rcard.purple{border-color:#7d5cff;background:linear-gradient(135deg,#1a1440,#0f1525)}.rcard.purple .rtag{background:linear-gradient(90deg,#ff5d8f,#7d5cff);color:#fff}
/* 実績・記録・小物 */
.verline{font-size:10.5px;color:var(--dim);text-align:center;margin-top:6px}
.streamok{font-size:10.5px;color:#8fd0a8;font-weight:700;text-align:center;margin-top:4px}
details.chlog{margin-top:12px;font-size:11.5px;color:var(--sub)}
details.chlog summary{cursor:pointer;font-weight:800}
details.chlog p{margin:6px 0 0;line-height:1.55}
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ach{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:92px}
.ach.on{border-color:var(--gold);background:linear-gradient(160deg,rgba(245,196,81,.14),#0d1220)}
.ach .ai{font-size:24px;line-height:1}
.ach b{display:block;font-size:13px;margin:6px 0 2px}
.ach small{display:block;font-size:10.5px;color:var(--sub);line-height:1.45}
.ach:not(.on) .ai{filter:grayscale(1);opacity:.4}
.ach:not(.on) b{color:var(--dim)}
.hist{list-style:none;margin:12px 0 0;padding:0}
.hist li{display:flex;gap:10px;align-items:center;background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:6px}
.hist li .hi{width:44px;flex:none;border-radius:8px;overflow:hidden}
.hist li b{display:block;font-size:13px}
.hist li small{display:block;font-size:10.5px;color:var(--sub);line-height:1.45}
.newach{margin-top:10px;padding:9px 10px;border-radius:12px;border:1px solid var(--gold);background:rgba(245,196,81,.1);font-size:12px;font-weight:700;line-height:1.6;text-align:left}
.tiplink{display:block;text-align:right;font-size:11px;color:var(--sub);margin-top:10px;text-decoration:none}
.sprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:8px}
.sprow button{padding:0;border:1px solid var(--line);background:#0d1220;border-radius:8px;overflow:hidden;color:var(--sub);font-size:10.5px;font-weight:700}
.sprow button.own{border-color:#8fd0a8}
.sprow button span{display:block;padding:4px 2px}
.rback{background:none;border:0;color:var(--sub);font-size:13px;font-weight:700;padding:6px 0}

/* result */
.rhead{text-align:center}
.rhead .rk{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:1px}
.rtitle{font-size:27px;font-weight:900;margin:6px 0 4px;letter-spacing:-.5px}
.rdesc{font-size:12.5px;color:#c7cfe2;line-height:1.6}
.rstatus{display:inline-block;font-size:13px;font-weight:900;letter-spacing:3px;padding:4px 14px;border-radius:999px;margin-bottom:8px}
.rstatus.clear{color:#1a1300;background:linear-gradient(90deg,var(--gold),#ffe28a);box-shadow:0 0 18px rgba(245,196,81,.5)}
.rstatus.over{color:#fff;background:var(--danger);box-shadow:0 0 18px rgba(255,77,109,.5)}
.evalcard{margin:6px auto 4px;display:inline-flex;flex-direction:column;align-items:center;padding:8px 22px;border-radius:14px;border:2px solid var(--c,#4a5a85);background:color-mix(in srgb,var(--c,#4a5a85) 14%,#0d1220)}
.evalcard small{font-size:10.5px;color:var(--sub);font-weight:800;letter-spacing:2px}
.evalcard b{font-size:24px;font-weight:900;color:var(--c,#fff)}
.rlbl{display:block;font-size:10.5px;color:var(--sub);font-weight:700;margin-top:10px;letter-spacing:1px}
.rmain{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.rmain div{background:#0d1220;border:1px solid #33405f;border-radius:14px;padding:10px 12px}
.rmain label{display:block;font-size:11px;color:var(--sub);font-weight:800}
.rmain b{display:block;font-size:21px;font-weight:900;margin-top:2px}
.rmain b small{font-size:12px;color:var(--sub)}
.rmain span{font-size:11px;color:var(--sub);font-weight:700}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.rstats div{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rstats label{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.rstats b{font-size:17px}
svg{display:block;width:100%;height:auto}
.rchar{position:relative;width:170px;margin:10px auto 2px;border-radius:18px;overflow:hidden;border:1px solid #3a4870;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.newb{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;animation:pop .6s .2s ease-out both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.rarebanner{margin:10px 0 0;padding:10px;border-radius:14px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff5d8f,#f5c451,#2fd89c,#7fb2ff,#b48cff);background-size:200%;animation:rainbow 3s linear infinite;text-shadow:0 1px 3px #0009}
.bragbtn{display:block;width:100%;min-height:72px;margin:14px 0 4px;border-radius:18px;border:3px solid #fff;font-size:22px;font-weight:900;color:#fff;background:#000;box-shadow:0 0 0 4px rgba(245,196,81,.35),0 0 30px rgba(180,140,255,.7);animation:bragpulse 1.4s ease-in-out infinite}
.bragbtn small{display:block;font-size:12px;font-weight:700;color:#f5c451;margin-top:2px}
@keyframes bragpulse{50%{transform:scale(1.03);box-shadow:0 0 0 6px rgba(245,196,81,.5),0 0 44px rgba(255,93,143,.8)}}
.dexbar{display:flex;align-items:center;gap:10px;margin-top:10px;background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700}
.dexbar b{color:var(--gold);font-size:15px}
.dexbar .pbar{flex:1}
.dexbar button{border:1px solid #4a5a85;background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;flex:none}
.pbar{height:6px;background:#1d2538;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffe9a0)}
#rcv{width:100%;height:160px;display:block;margin-top:12px;background:#0d1220;border:1px solid var(--line);border-radius:12px}
.trial{margin:10px 0 4px;padding:9px 10px;border-radius:12px;font-size:12px;line-height:1.55;font-weight:700}
.trial.win{background:linear-gradient(90deg,rgba(245,196,81,.25),rgba(180,140,255,.25));border:1px solid var(--gold);color:#fff3c0}
.trial.lose{background:#151a28;border:1px dashed #4a5a85;color:#aab3c8}
.modetag{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:#23366e;color:#cfe;margin-left:4px}

/* rarity */
.rar{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;letter-spacing:.5px}
.rar.r-N{background:#232d45;color:#aab3c8}
.rar.r-SR{background:linear-gradient(90deg,#f5c451,#ffe9a0);color:#3a2600}
.rar.r-LEGEND{background:linear-gradient(90deg,#ff5d8f,#f5c451,#2fd89c,#7fb2ff,#b48cff);background-size:200%;color:#fff;text-shadow:0 1px 2px #0008;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
.rhead .rar{margin-top:10px;font-size:12px;padding:3px 12px}
.rchar.rare-SR{border:2px solid var(--gold);box-shadow:0 0 26px rgba(245,196,81,.6)}
.rchar.rare-LEGEND{border:2px solid #fff;box-shadow:0 0 18px #ff5d8f,0 0 36px #7fb2ff,0 0 60px #f5c451;animation:legend 2s ease-in-out infinite alternate}
@keyframes legend{to{box-shadow:0 0 26px #b48cff,0 0 46px #2fd89c,0 0 70px #ff5d8f}}

/* dex */
#dexScr{z-index:55;align-items:flex-start}
.dexpanel{padding:16px 10px}
.dexhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:0 4px;flex-wrap:wrap}
.dexhead b{font-size:18px}
.dexhead span{color:var(--gold);font-weight:800;font-size:12.5px}
.xclose{margin-left:auto;border:0;background:var(--panel2);width:36px;height:36px;border-radius:50%;font-size:14px}
.dexaxis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--sub);font-weight:700;margin:10px 2px 0 32px}
.dexgrid{display:grid;grid-template-columns:30px repeat(8,1fr);gap:2px;margin-top:4px}
.dexgrid .dh{font-size:8px;color:var(--sub);font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.1;padding:2px 0;word-break:break-word}
.dexgrid button{padding:0;border:1px solid var(--line);background:#0d1220;border-radius:5px;overflow:hidden;aspect-ratio:6/7;color:#3a4560;font-size:13px;font-weight:900;position:relative}
.dexgrid button.own{border-color:#4a5a85}
.dexgrid button.sel{outline:2px solid var(--gold);outline-offset:-1px}
.dexgrid button.r-SR{border-color:#8a6a20;color:#e0b040}
.dexgrid button.r-LEGEND{border-color:#b48cff;color:#e8d8ff}
.dexdetail{display:flex;gap:12px;align-items:center;margin-top:12px;background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.dexdetail .dimg{width:96px;flex:none;border-radius:10px;overflow:hidden;border:1px solid #3a4870}
.dexdetail .lock{height:112px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#e0b040;background:#090c14}
.dexdetail b{display:block;font-size:16px;margin:2px 0 4px}
.dexdetail p{margin:4px 0 6px;font-size:11.5px;line-height:1.5;color:#c7cfe2}
.dexdetail small{font-size:10.5px;color:var(--sub);line-height:1.5}
.dimg.rare-SR{border-color:var(--gold)!important}
.dimg.rare-LEGEND{border:2px solid #fff!important;box-shadow:0 0 14px #b48cff}
.dhint{font-size:12px;color:var(--sub);line-height:1.6;text-align:center;width:100%}
.dexrates{margin-top:12px;background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:10px}
.dexrates h4{margin:0 0 6px;font-size:13px}
.dexrates table{width:100%;border-collapse:collapse;font-size:11px}
.dexrates th{color:var(--sub);font-weight:700;text-align:left;padding:4px 2px;border-bottom:1px solid var(--line)}
.dexrates td{padding:6px 2px;border-bottom:1px dashed var(--line)}
.dexrates p{font-size:10.5px;color:var(--sub);line-height:1.6;margin:8px 0 0}

/* feedback */
#fbScr{z-index:70}
.fb label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin:12px 0 5px}
.fb select,.fb textarea,.fb input[type=text]{width:100%;background:#0d1220;border:1px solid #33405f;border-radius:10px;padding:10px;font-size:14px}
.fb textarea{min-height:120px;resize:vertical}
.fb .chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#c7cfe2;font-weight:600;margin-top:12px}
.fb .chk input{margin-top:2px}
.fbrow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:6px}
.flashmsg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,26,42,.96);border:1px solid #3a4870;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:80;pointer-events:none;transition:opacity .3s;max-width:88vw;text-align:center}
</style>
</head>

function money(v){
  const s = v<0 ? '-' : ''; v = Math.abs(v);
  const f = (x, d) => x.toFixed(d).replace(/\.0+$/, '');
  if(LANG==='ja'){
    if(v>=1e8) return s+(v/1e8).toFixed(v>=1e10?0:2)+'億円';
    if(v>=1e4) return s+(v<1e6?(v/1e4).toFixed(1):Math.floor(v/1e4).toLocaleString())+'万円';
    return s+Math.floor(v).toLocaleString()+'円';
  }
  if(LANG==='zh' || LANG==='ko'){
    const oku = LANG==='zh' ? '亿' : '억', man = LANG==='zh' ? '万' : '만';
    if(v>=1e8) return s+'¥'+(v/1e8).toFixed(v>=1e10?0:2)+oku;
    if(v>=1e4) return s+'¥'+(v<1e6?(v/1e4).toFixed(1):Math.floor(v/1e4).toLocaleString())+man;
    return s+'¥'+Math.floor(v).toLocaleString();
  }
  if(v>=1e9) return s+'¥'+f(v/1e9, 2)+'B';
  if(v>=1e6) return s+'¥'+f(v/1e6, 2)+'M';
  if(v>=1e3) return s+'¥'+f(v/1e3, 1)+'K';
  return s+'¥'+Math.floor(v);
}
function moneyShort(v){
  const s = v<0 ? '-' : ''; v = Math.abs(v);
  if(LANG==='en'){ if(v>=1e9) return s+(v/1e9).toFixed(v>=1e10?0:1)+'B'; if(v>=1e6) return s+Math.round(v/1e6)+'M'; if(v>=1e3) return s+Math.round(v/1e3)+'K'; return s+Math.round(v); }
  const oku = LANG==='zh' ? '亿' : LANG==='ko' ? '억' : '億', man = LANG==='zh' ? '万' : LANG==='ko' ? '만' : '万';
  if(v>=1e8) return s+(v/1e8).toFixed(v>=1e9?0:1)+oku;
  if(v>=1e4) return s+Math.round(v/1e4)+man;

}

/* ==================== 図鑑（localStorage） ==================== */
function loadDex(){ try{ return JSON.parse(localStorage.getItem(DEX_KEY)) || {}; }catch(e){ return {}; } }
function saveDex(d){ try{ localStorage.setItem(DEX_KEY, JSON.stringify(d)); }catch(e){} }
const dexCount = d => Object.keys(d).length;
const dexSplit = d => { let n = 0, r = 0; for(const k in d) RARE[k] ? r++ : n++; return {n, r}; };

/* ==================== 状態 ==================== */
let S = null;
const ui = { mode:'price', range:'3y', paused:true, running:false };
const route = () => ROUTES[S.route] || ROUTES.high;

function newState(routeId = 'high', mode = 'normal'){
  const R = ROUTES[routeId] || ROUTES.high;
  S = { v:2, route:routeId, mode, startAge:R.startAge, skill:{...R.skill}, kBias:R.kBias, y0: 3000 + rint(10, 89),
        age:R.startAge, tick:0, t:0, cash:R.cash, shA:0, shB:0, costA:0, costB:0, pA:100, pB:100,
        karma:50+R.kBias, kAcc:0, kN:0, margin:false, auto:false, insured:0, speed:1,
        hA:[100], hB:[100], hT:[R.cash], marks:[], pending:[], log:[],
        yearly:[R.cash], yearlyK:[50+R.kBias], yearStart:R.cash, peak:R.cash, lifeDone:{}, sched:[], over:false };
  S.sched = scheduleYear(S.age);
}
function income(age){
  if(age>=65) return -1.5e6;
  let v = 0; for(const [a, p] of route().pay) if(age>=a) v = p;
  return v * S.skill.earn;
}
function stageName(age){ const s = D().stage; return age>=65 ? s.pension : S.route==='high' ? (age<22 ? s.newbie : s.tataki) : s.uni; }
const feeRate = () => S.skill.trade ? 0 : 0.001;
const loanRate = () => S.skill.trade ? 0.03 : 0.06;
const valA = () => S.shA*S.pA, valB = () => S.shB*S.pB;
const total = () => S.cash + valA() + valB();
const power = () => S.margin ? Math.max(0, S.cash + total()) : Math.max(0, S.cash);

/* ===== データ参照のヘルパー ===== */
const txt = o => o ? (o[LANG] !== undefined ? o[LANG] : o.ja) : '';
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const inPeriod = x => (!x.from || today() >= x.from) && (!x.to || today() <= x.to);
const modeById = id => CONST_MODES.find(m => m.id===id) || CONST_MODES[0];
const availableModes = () => CONST_MODES.filter(m => m.enabled !== false && (!m.limited || inPeriod(m)));
const activeSeasons = () => CONST_SEASON_EVENTS.filter(s => s.enabled || ((s.from || s.to) && inPeriod(s)));
const findDef = ev => (ev.kind==='hist' ? CONST_EVENTS : CONST_RUMORS).find(d => d.id===ev.id);
function weightedPick(list, mult){
  const ws = list.map(d => (d.w ?? 1) * mult.reduce((x, m) => x * ((m && m[d.id]) ?? 1), 1));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for(let i=0;i<list.length;i++){ r -= ws[i]; if(r <= 0) return list[i]; }
  return list[list.length-1];
}

/* 1年分の出来事を毎回ランダムに生成（順序・タイミング・変動幅すべて）。モード・季節イベントの倍率や強制ニュースもここで反映 */
function scheduleYear(age){
  const ev = [], r = Math.random(), mode = modeById(S.mode), seasons = activeSeasons();
  const mult = [mode.eventWeights, ...seasons.map(s => s.weights)];
  const nMajor = r < .35 ? 0 : r < .85 ? 1 : 2;
  for(let i=0;i<nMajor;i++){
    const d = weightedPick(CONST_EVENTS, mult), M = .12 + Math.random()*.38;
    const f = Math.random() < .2 ? (-.6 + Math.random()*.9) : 1; // 2割は見出しと違う動き（サプライズ）
    ev.push({tk:rint(3,50), kind:'hist', id:d.id, p:rint(0,7), ia:d.a, ib:d.b, a:d.a*M*f, b:d.b*M*f*MKT.evB, real:true});
  }
  const nR = rint(0, 2);
  for(let i=0;i<nR;i++){
    const d = weightedPick(CONST_RUMORS, mult), m = .1 + Math.random()*.15;
    ev.push({tk:rint(3,50), kind:'rumor', id:d.id, p:rint(0,7), ia:d.a, ib:d.b, a:d.a*m, b:d.b*m*MKT.evB, real:Math.random()<.7});
  }
  // 強制ニュース（モード／季節イベントの scripted）
  for(const sc of [...(mode.scripted||[]), ...seasons.flatMap(s => s.scripted||[])]){
    if(sc.age !== age) continue;
    ev.push({tk:rint(8,40), kind:sc.kind||'hist', custom:sc.text, p:rint(0,7), ia:Math.sign(sc.a||0), ib:Math.sign(sc.b||0), a:sc.a||0, b:sc.b||0, real:sc.real !== false});
  }
  for(const L of CONST_LIFE){
    if(age>=L.min && age<=L.max && !(L.once && S.lifeDone[L.id]) && Math.random()<L.p){
      ev.push({tk:rint(5,55), kind:'life', id:L.id, cost:L.cost * (L.id==='sick' && age>=60 ? 2 : 1)});
      if(L.once) S.lifeDone[L.id] = 1;
    }
  }
  return ev;
}
const evText = ev => (ev.custom ? txt(ev.custom) : txt((findDef(ev) || {}).text)).replace('{p}', D().places[ev.p || 0]);

// 分析力によるニュースの読み（Lv1：軍需の本当の向き／Lv2：両方／Lv3：大きさも。噂は真偽の見抜き率UP）
function analysis(ev){
  const L = S.skill.ana; if(!L) return '';
  const dir = x => x>.03 ? '▲' : x<-.03 ? '▼' : '→';
  const size = x => Math.abs(x)>=.25 ? tr('big') : '';
  const p = [tr('anaA',{d:dir(ev.a)+(L>=3?size(ev.a):'')})];
  if(L>=2) p.push(tr('anaB',{d:dir(ev.b)+(L>=3?size(ev.b):'')}));
  let s = tr('ana',{l:L, p:p.join(' ')});
  if(ev.kind==='rumor'){
    const right = Math.random() < Math.min(.95, .55 + .15*L);
    s += tr('cred',{v: (ev.real === right) ? tr('credHi') : tr('credLo')});
  }
  return s;
}

/* ==================== シミュレーション ==================== */
function step(){
  S.t++; S.tick++;
  const m = gauss();
  let rA = MKT.A.mu/TPY + MKT.A.sig/Math.sqrt(TPY)*(.4*m + .92*gauss());
  let rB = MKT.B.mu/TPY + MKT.B.sig/Math.sqrt(TPY)*(.4*m + .92*gauss());
  for(const p of S.pending){
    if(S.t===p.s){
      if(p.real) news('flash', tr('react',{a:arrow(p.a), b:arrow(p.b)}));
      else news('fake', tr('fake',{t:evText(p.ev)}));
    }
    if(S.t>=p.s && S.t<p.e){ rA += p.a/(p.e-p.s); rB += p.b/(p.e-p.s); }
  }
  S.pending = S.pending.filter(p => S.t < p.e);
  S.pA = Math.max(.5, S.pA*Math.exp(rA));
  S.pB = Math.max(.5, S.pB*Math.exp(rB));

  S.cash *= 1 + (S.cash>=0 ? .005 : loanRate())/TPY;
  S.cash += income(S.age)/TPY;

  // 潔白さ＝人生全体の「平和寄り − 軍需寄り」の平均（最初の10年分は中立として加重）
  const E = Math.max(total(), 1);
  const fA = clamp(valA()/E, 0, 2), fB = clamp(valB()/E, 0, 2);
  S.kAcc += clamp(fB - fA, -1, 1); S.kN++;
  S.karma = clamp(50 + (S.kBias||0) + 50*S.kAcc/(S.kN + 10*TPY), 0, 100);

  for(const ev of S.sched){
    if(ev.tk!==S.tick) continue;
    if(ev.kind==='life'){
      const cost = ev.cost>0 ? Math.min(ev.cost, Math.max(0, total())*.5) : ev.cost;
      S.cash -= cost;
      if(ev.id==='lotto') S.lotto = true;
      news('life', `${txt((CONST_LIFE.find(l => l.id===ev.id) || {}).text)} ${cost>0?'−':'+'}${money(Math.abs(cost))}`);
    } else {
      const d = ev.kind==='hist' ? rint(8,16) : rint(6,12), dur = rint(14,28);
      const la = Math.log(1+ev.a), lb = Math.log(1+ev.b);
      S.pending.push({s:S.t+d, e:S.t+d+dur, real:ev.real, ev:{kind:ev.kind, id:ev.id, p:ev.p, custom:ev.custom},
        a: ev.real ? la : -.3*la, b: ev.real ? lb : -.3*lb});
      const hint = analysis(ev);
      news(ev.kind, evText(ev) + (hint ? '\n' + hint : ''));
      if(S.auto) autoTrade(ev);
    }
    S.marks.push({t:S.t, k:ev.kind});
  }

  let T = total();
  if(T<=0){
    if(modeById(S.mode).bankrupt==='insure'){ insure(); T = total(); }
    else { pushHist(T); finish(true); return; }
  }
  pushHist(T);

  if(S.tick>=TPY){
    S.tick = 0; S.age++;
    S.yearly.push(Math.round(T)); S.yearlyK.push(Math.round(S.karma*10)/10); S.yearStart = T;
    if(S.age>=END_AGE){ finish(false); return; }
    const st = route().pay.find(([a]) => a===S.age);
    if(st && S.age!==S.startAge) news('sys', tr('promo',{what:D().promoWhat[S.age>=50?2:S.age>=30?1:0], v:money(income(S.age))}));
    if(S.route==='high' && (S.age===30 || S.age===45)){ S.skill.ana++; news('sys', tr('skillUp',{n:S.skill.ana})); }
    if(S.age===65) news('sys', tr('retire',{v:money(1.5e6)}));
    S.sched = scheduleYear(S.age);
    if(S.auto) autoTrade(null);
    save();
  }
}
function pushHist(T){
  S.peak = Math.max(S.peak, T);
  S.hA.push(Math.round(S.pA*100)/100);
  S.hB.push(Math.round(S.pB*100)/100);
  S.hT.push(Math.round(T));
}
const arrow = x => x>.02 ? '▲' : x<-.02 ? '▼' : '→';

/* イージー：倒産防止保険（負債清算＋前年末資産の半額で再スタート） */
function insure(){
  S.insured = (S.insured||0) + 1;
  const base = Math.max(1e5, (S.yearStart||0) * .5);
  S.shA = S.shB = S.costA = S.costB = 0; S.margin = false; S.cash = base;
  news('sys', tr('insured',{v:money(base), n:S.insured}));
  flash(tr('insured',{v:money(base), n:S.insured}));
}

/* 売買 */
function trade(act, k, f){
  if(!ui.running || S.over) return;
  if(act==='cashall'){ trade('sell','A',1); trade('sell','B',1); return; }
  const sk = 'sh'+k, ck = 'cost'+k, price = S['p'+k];
  if(act==='buy'){
    const amt = power()*f;
    if(amt<1){ flash(tr('noPower')); return; }
    S[sk] += amt*(1-feeRate())/price; S[ck] += amt; S.cash -= amt;
    if(k==='A') S.boughtA = true; else S.boughtB = true;
  } else {
    if(S[sk]<=0) return;
    const sh = S[sk]*f;
    S.cash += sh*price*(1-feeRate()); S[ck] *= (1-f); S[sk] -= sh;
    if(f===1 || S[sk]<1e-9){ S[sk]=0; S[ck]=0; }
  }
  S.manual = (S.manual||0) + 1;
  if(navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) try{ navigator.vibrate(8); }catch(e){}
  render(); ui.dirty = true;
}
/* 目標配分に合わせて売買（おまかせ用） */
function rebalance(wA, wB){
  const E = total(); if(E<=0) return;
  const ta = wA*E, tb = wB*E, va = valA(), vb = valB(), fee = (Math.abs(ta-va) + Math.abs(tb-vb)) * feeRate();
  if(ta > va + 1) S.boughtA = true;
  if(tb > vb + 1) S.boughtB = true;
  S.costA = ta>va ? S.costA + (ta-va) : (va>0 ? S.costA*ta/va : 0);
  S.costB = tb>vb ? S.costB + (tb-vb) : (vb>0 ? S.costB*tb/vb : 0);
  S.shA = ta/S.pA; S.shB = tb/S.pB; S.cash = E - ta - tb - fee;
}
/* おまかせAI：見出し（分析力があれば本当の向き）に応じて配分を傾ける。年初は45:45に戻す */
function autoTrade(ev){
  S.margin = false;
  let a = 0, b = 0, w = .18;
  if(ev){
    a = S.skill.ana>=1 ? clamp(ev.a/.25, -1, 1) : ev.ia;
    b = S.skill.ana>=2 ? clamp(ev.b/.25, -1, 1) : ev.ib;
    if(ev.kind==='rumor') w = .08;
  }
  let wA = clamp(.45 + a*w, .05, .85), wB = clamp(.45 + b*w, .05, .85);
  const s = wA + wB; if(s > .95){ wA *= .95/s; wB *= .95/s; }
  const curE = Math.max(total(), 1);
  if(Math.abs(valA()/curE - wA) < .03 && Math.abs(valB()/curE - wB) < .03) return;
  rebalance(wA, wB);
  if(!window.__fast) news('auto', tr('autoLog',{a:Math.round(wA*100), b:Math.round(wB*100)}));
}
function setAuto(on){
  if(!S || S.over || !ui.running) return;
  S.auto = on;
  if(on){ S.autoEver = true; ui.paused = false; autoTrade(null); }
  flash(tr(on ? 'autoOn' : 'autoOff'));
  render(); ui.dirty = true;
}

/* ==================== ニュース・表示 ==================== */
let toastTimer = 0;
function news(kind, text){
  if(window.__fast) return;
  S.log.unshift({y:yearOf(S.age), age:S.age, k:kind, text});
  if(S.log.length>60) S.log.length = 60;
  const tt = $('tickerText');
  tt.textContent = `【${D().kinds[kind]}】${text.replace(/\n/g, '　')}`;
  tt.style.animation = 'none'; void tt.offsetWidth; tt.style.animation = '';
  showToast(kind, text);
  renderLog();
}
function showToast(kind, text){
  const el = $('toast');
  el.innerHTML = `<span class="badge k-${kind}">${D().kinds[kind]}</span>${escapeHtml(text)}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4200);
}
function flash(msg){
  if(window.__fast) return;
  const d = document.createElement('div'); d.className = 'flashmsg'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = 0; setTimeout(() => d.remove(), 300); }, 1600);
}
function renderLog(){
  $('log').innerHTML = S.log.map(l => `<li><em>${l.y} · ${l.age}</em><span class="badge k-${l.k}">${D().kinds[l.k]||''}</span>${escapeHtml(l.text)}</li>`).join('');
}
const karmaName = k => D().klbl[kIdx(k)];
function setChg(el, v, prefix=''){ el.textContent = prefix + pct(v); el.className = 'num ' + (v>=0?'up':'down'); }
function render(){
  if(!S) return;
  $('age').innerHTML = tr('ageFmt',{a:S.age});
  $('year').textContent = tr('yearFmt',{y:yearOf(S.age)});
  $('stage').textContent = stageName(S.age);
  const sk = S.skill, skKey = [LANG, S.route, sk.ana, sk.trade, sk.earn, S.mode, S.auto].join();
  if(ui.skKey !== skKey){
    ui.skKey = skKey;
    $('skills').innerHTML = `<span>🎓 ${escapeHtml(D().routeNames[S.route])}</span><span>${escapeHtml(txt(modeById(S.mode).name))}</span>`
      + `<span class="${sk.ana?'':'off'}">${tr('skillAna',{n:sk.ana})}</span>`
      + `<span class="${sk.trade?'':'off'}">${tr(sk.trade?'feeZero':'feeStd')}</span>`
      + (sk.earn > 1 ? `<span>${tr('earn',{n:sk.earn})}</span>` : '')
      + (S.auto ? `<span class="autoc">${tr('autoChip')}</span>` : '');
  }
  $('remain').textContent = tr('remain',{n:END_AGE-S.age});
  const T = total();
  $('total').textContent = money(T);
  $('total').style.color = T<0 ? 'var(--danger)' : '';
  setChg($('totalChg'), S.yearStart>0 ? T/S.yearStart-1 : 0, tr('chgPrefix'));
  $('karmaV').textContent = Math.round(S.karma);
  $('karmaMark').style.left = S.karma+'%';
  const kk = kIdx(S.karma), ak = (T<=0 ? 0 : tierOf(T, kk)) + '-' + kk + LANG;

/* ==================== チャート ==================== */
const cv = $('cv'), ctx = cv.getContext('2d');
function fitCanvas(c){
  const dpr = window.devicePixelRatio||1, W = c.clientWidth, H = c.clientHeight;
  if(c.width!==Math.round(W*dpr) || c.height!==Math.round(H*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  return [W,H];
}
function drawChart(){
  const [W,H] = fitCanvas(cv);
  if(!S) return;
  const N = S.hA.length, all = ui.range==='all';
  const span = all ? Math.max(N-1, TPY) : TPY*3;
  const start = all ? 0 : Math.max(0, N-1-span);
  const L=8, R=50, T=24, B=18, pw=W-L-R, ph=H-T-B;
  const X = i => L + (i-start)/span*pw;
  const series = ui.mode==='price'
    ? [{d:S.hA,c:COL.A,n:tr('legA')},{d:S.hB,c:COL.B,n:tr('legB')}]
    : [{d:S.hT,c:COL.T,n:tr('legT'),fill:true}];
  const lg = v => Math.log(Math.max(v, ui.mode==='price'?.5:1e3));
  let mn=Infinity, mx=-Infinity;
  for(const s of series) for(let i=start;i<N;i++){ const v=lg(s.d[i]); if(v<mn)mn=v; if(v>mx)mx=v; }
  if(mx-mn<.06){ const c=(mx+mn)/2; mn=c-.03; mx=c+.03; }
  const pad=(mx-mn)*.1; mn-=pad; mx+=pad;
  const Y = v => T + (1-(lg(v)-mn)/(mx-mn))*ph;
  ctx.font = '600 10px -apple-system,sans-serif'; ctx.textBaseline='middle';
  for(let j=0;j<=4;j++){
    const lv = mn+(mx-mn)*j/4, y = T+(1-j/4)*ph, v = Math.exp(lv);
    ctx.strokeStyle='rgba(120,140,190,.10)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke();
    ctx.fillStyle='#5b6580'; ctx.textAlign='left';
    ctx.fillText(ui.mode==='price' ? (v>=100?v.toFixed(0):v.toFixed(1)) : moneyShort(v), W-R+6, y);
  }
  const yStep = all ? (span>TPY*30?10:5) : 1, y0 = yearOf(S.startAge);
  ctx.textAlign='center';
  for(let t=Math.ceil(start/TPY)*TPY; t<=start+span; t+=TPY){
    const yr = y0 + t/TPY;
    if(all && (yr - y0) % yStep !== 0) continue;
    const x = X(t);
    ctx.strokeStyle='rgba(120,140,190,.12)'; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,T+ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#5b6580'; ctx.fillText(yr, x, H-8);
  }
  for(const mk of S.marks){
    if(mk.t<start) continue;
    const x = X(mk.t);
    ctx.fillStyle = mk.k==='hist'?COL.gold : mk.k==='life'?COL.life : COL.rumor;
    ctx.beginPath(); ctx.moveTo(x-3.5,T-6); ctx.lineTo(x+3.5,T-6); ctx.lineTo(x,T); ctx.closePath(); ctx.fill();
  }
  const stp = Math.max(1, Math.floor((N-start)/pw));
  const path = s => { ctx.beginPath(); let first=true; for(let i=start;i<N;i+=stp){ const x=X(i), y=Y(s.d[i]); first?ctx.moveTo(x,y):ctx.lineTo(x,y); first=false; } ctx.lineTo(X(N-1), Y(s.d[N-1])); };
  for(const s of series){
    if(s.fill){
      path(s); ctx.lineTo(X(N-1),T+ph); ctx.lineTo(X(start),T+ph); ctx.closePath();
      const g = ctx.createLinearGradient(0,T,0,T+ph); g.addColorStop(0,'rgba(127,178,255,.30)'); g.addColorStop(1,'rgba(127,178,255,0)');
      ctx.fillStyle=g; ctx.fill();
    }
    path(s);
    ctx.strokeStyle=s.c; ctx.lineWidth=2; ctx.lineJoin='round';
    ctx.shadowColor=s.c; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
    const ex=X(N-1), ey=Y(s.d[N-1]);
    const pulse = 3 + 2*Math.abs(Math.sin(performance.now()/300));
    ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(ex,ey,pulse,0,Math.PI*2); ctx.fill();
    const lbl = ui.mode==='price' ? (s.d[N-1]>=1000?s.d[N-1].toFixed(0):s.d[N-1].toFixed(1)) : moneyShort(s.d[N-1]);
    ctx.fillStyle=s.c; ctx.fillRect(W-R+2, ey-8, R-4, 16);
    ctx.fillStyle='#0a0d14'; ctx.textAlign='center'; ctx.fillText(lbl, W-R/2, ey);
  }
  ctx.textAlign='left'; let lx=L+2;
  for(const s of series){
    ctx.fillStyle=s.c; ctx.fillRect(lx, 9, 10, 3); ctx.fillStyle='#aab3c8'; ctx.fillText(s.n, lx+14, 11);
    lx += ctx.measureText(s.n).width + 28;
  }
}
/* 結果画面：資産（対数・左軸）と潔白さ（0〜100・右軸）の推移 */
function drawResultChart(){
  const c = $('rcv'); if(!c || !S) return;
  const [W,H] = fitCanvas(c), x = c.getContext('2d');
  const d = S.yearly.concat([Math.round(total())]), kd = S.yearlyK.concat([S.karma]), n = d.length;
  const L=40, R=30, T=26, B=20, pw=W-L-R, ph=H-T-B;
  const lg = v => Math.log10(Math.max(v, 1e4));
  let mn = Math.min(...d.map(lg)), mx = Math.max(...d.map(lg)); if(mx-mn < .5){ mx += .25; mn -= .25; }
  const X = i => L + i/(n-1||1)*pw, Ya = v => T + (1-(lg(v)-mn)/(mx-mn))*ph, Yk = k => T + (1-k/100)*ph;
  x.font = '600 10px -apple-system,sans-serif'; x.textBaseline = 'middle';
  for(let j=0;j<=2;j++){
    const y = T + j*ph/2;
    x.strokeStyle = 'rgba(120,140,190,.12)'; x.beginPath(); x.moveTo(L,y); x.lineTo(W-R,y); x.stroke();
    x.fillStyle = COL.gold; x.textAlign = 'right'; x.fillText(moneyShort(Math.pow(10, mx - (mx-mn)*j/2)), L-4, y);
    x.fillStyle = COL.K; x.textAlign = 'left'; x.fillText(String(100 - j*50), W-R+4, y);
  }
  x.fillStyle = '#5b6580'; x.textAlign = 'left'; x.fillText(String(yearOf(S.startAge)), L, H-8);
  x.textAlign = 'right'; x.fillText(String(yearOf(S.age)), W-R, H-8);
  x.beginPath(); kd.forEach((v,i) => i ? x.lineTo(X(i),Yk(v)) : x.moveTo(X(i),Yk(v)));
  x.setLineDash([4,3]); x.strokeStyle = COL.K; x.lineWidth = 2; x.stroke(); x.setLineDash([]);
  x.beginPath(); d.forEach((v,i) => i ? x.lineTo(X(i),Ya(v)) : x.moveTo(X(i),Ya(v)));
  x.strokeStyle = COL.gold; x.lineWidth = 2.5; x.shadowColor = COL.gold; x.shadowBlur = 8; x.stroke(); x.shadowBlur = 0;
  x.textAlign = 'left'; x.fillStyle = COL.gold; x.fillRect(L, 10, 12, 3); x.fillText(tr('chartAssets'), L+16, 12);
  const w1 = x.measureText(tr('chartAssets')).width;
  x.fillStyle = COL.K; x.fillRect(L+30+w1, 10, 12, 3); x.fillText(tr('chartKarma'), L+46+w1, 12);
}

function shareUrl(){
  if(GAME_URL) return GAME_URL;
  return /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
}

/* ==================== 図鑑 ==================== */
function showDex(sel){
  const d = loadDex(), sp = dexSplit(d), L = D();
  $('dexCnt').textContent = tr('dexCount',{n:sp.n, N:NORMAL_N, r:RARE_N - sp.r});
  $('dexBar').style.width = (dexCount(d)/64*100)+'%';
  let h = '<div></div>' + L.klbl.map(l => `<div class="dh">${l}</div>`).join('');
  for(let t=7;t>=0;t--){
    h += `<div class="dh">${L.wlbl[t]}</div>`;
    for(let k=0;k<8;k++){
      const key = t+'-'+k, own = d[key], rr = RARE[key];
      const inner = own ? charSVG(t,k) : rr ? '★' : charSVG(t,k,true);
      h += `<button data-dex="${key}" class="${own?'own':''} r-${rarityOf(key)}">${inner}</button>`;
    }
  }
  $('dexGrid').innerHTML = h;
  // スペシャル称号（CONST_TITLES.special に追加すると自動で枠が増える）
  const sg = loadJSON(SP_KEY, {}), spl = CONST_TITLES.special;
  $('dexSp').innerHTML = spl.length ? `<h4>${tr('spTitle')}　<small style="color:var(--gold)">${tr('spCount',{n:spl.filter(s => sg[s.id]).length, N:spl.length})}</small></h4><div class="sprow">`
    + spl.map(s => `<button data-sp="${s.id}" class="${sg[s.id]?'own':''}">${charSVG(s.art[0], s.art[1], !sg[s.id])}<span>${sg[s.id] ? escapeHtml(txt(s.name)) : '？？？'}</span></button>`).join('') + `</div>` : '';
  const rows = Object.keys(RARE).sort((a,b) => RARE[a].q - RARE[b].q || a.localeCompare(b)).map(key => {
    const [t,k] = key.split('-').map(Number), own = d[key];
    return `<tr><td><span class="rar r-${RARE[key].r}">${RARE[key].r}</span></td><td>${own ? escapeHtml(L.titles[t][k]) : '？？？'}</td><td>${rateText(estOf(key))}</td></tr>`;
  }).join('');
  $('dexRates').innerHTML = `<h4>${tr('ratesTitle')}</h4><table><tr><th>${tr('thRarity')}</th><th>${tr('thTitle')}</th><th>${tr('thRate')}</th></tr>${rows}</table><p>${tr('ratesNote',{lo:RATE_NORMAL[0], hi:RATE_NORMAL[1]})}</p>`;
  dexDetail(sel || null);
  $('dexScr').classList.remove('hidden');
  ui.dexOpen = sel || true;
}
function dexDetail(key){
  document.querySelectorAll('#dexGrid [data-dex]').forEach(b => b.classList.toggle('sel', b.dataset.dex===key));
  const el = $('dexDetail'), L = D();
  if(!key){ el.innerHTML = `<div class="dhint">${tr('dexHint',{N:NORMAL_N, R:RARE_N})}</div>`; return; }
  const [t,k] = key.split('-').map(Number), e = loadDex()[key], rr = RARE[key], rar = rarityOf(key);
  const rateLine = `<span class="rar r-${rar}">${L.rarity[rar]}</span> ${tr('estRate',{v:rateText(estOf(key))})}`;
  const cond = tr('cond',{k:kRange(k), kl:L.klbl[k], w:wRange(t,k)});
  if(e){
    el.innerHTML = `<div class="dimg rare-${rar}">${charSVG(t,k)}</div><div><small>No.${titleNo(t,k)}・${L.arch[k]}</small><b style="color:${titleColor(k)}">${escapeHtml(L.titles[t][k])}</b><small>${rateLine}</small><p>${L.wdesc[t]}${L.kdesc[k]}</p><small>${rr ? '' : cond + '<br>'}${tr('got',{n:e.n, v:money(e.best)})}</small></div>`;
  } else if(rr){
    el.innerHTML = `<div class="dimg lock">★</div><div><small>No.${titleNo(t,k)}</small><b>？？？</b><small>${rateLine}</small><p>${tr('rareSecret')}</p></div>`;
  } else {
    el.innerHTML = `<div class="dimg">${charSVG(t,k,true)}</div><div><small>No.${titleNo(t,k)}・${L.arch[k]}</small><b>${escapeHtml(L.titles[t][k])}</b><small>${rateLine}</small><p>${tr('notYet')}</p><small>${cond}</small></div>`;
  }
}
$('dexGrid').addEventListener('click', e => { const b = e.target.closest('[data-dex]'); if(b) dexDetail(b.dataset.dex); });
$('dexSp').addEventListener('click', e => {
  const b = e.target.closest('[data-sp]'); if(!b) return;
  const s = spById(b.dataset.sp), n = loadJSON(SP_KEY, {})[s.id];
  document.querySelectorAll('#dexGrid [data-dex]').forEach(x => x.classList.remove('sel'));
  $('dexDetail').innerHTML = `<div class="dimg">${charSVG(s.art[0], s.art[1], !n)}</div><div><small>${tr('spTitle')}</small><b>${n ? escapeHtml(txt(s.name)) : '？？？'}</b><p>${escapeHtml(txt(s.desc))}</p>${n ? `<small>${tr('got',{n, v:'—'}).replace(/／.*$/, '')}</small>` : ''}</div>`;
  $('dexDetail').scrollIntoView({behavior:'smooth', block:'center'});
});
$('dexClose').onclick = () => { $('dexScr').classList.add('hidden'); ui.dexOpen = false; };
$('btnDex').onclick = () => showDex();

/* ==================== 実績図鑑・歴代記録 ==================== */
function showAch(){
  const un = loadJSON(ACH_KEY, {}), N = CONST_ACHIEVEMENTS.length, n = CONST_ACHIEVEMENTS.filter(a => un[a.id]).length;
  $('subPanel').innerHTML = `<div class="dexhead"><b>${tr('achTitle')}</b><span>${tr('achRate',{n, N, p:Math.floor(n/N*100)})}</span><button class="xclose" data-close>✕</button></div>
    <div class="pbar"><i style="width:${n/N*100}%"></i></div>
    <div class="achgrid">${CONST_ACHIEVEMENTS.map(a => `<div class="ach ${un[a.id]?'on':''}"><div class="ai">${a.icon}</div><b>${escapeHtml(txt(a.name))}</b><small>${escapeHtml(txt(a.desc))}</small><small>${un[a.id] ? '✔ ' + un[a.id] : tr('achLocked')}</small></div>`).join('')}</div>`;
  $('subScr').classList.remove('hidden'); $('subScr').scrollTop = 0; ui.sub = 'ach';
}
function showHist(){
  const recs = loadJSON(HIST_KEY, []), L = D();
  $('subPanel').innerHTML = `<div class="dexhead"><b>${tr('histTitle')}</b><button class="xclose" data-close>✕</button></div><div class="note" style="text-align:left">${tr('histNote')}</div>`
    + (recs.length ? `<ul class="hist">${recs.map(x => { const [t,k] = x.key.split('-').map(Number);
        return `<li><div class="hi">${charSVG(t,k)}</div><div><b>${escapeHtml(L.titles[t][k])} ${x.rarity!=='N' ? `<span class="rar r-${x.rarity}">${x.rarity}</span>` : ''}</b>
        <small>${money(x.T)} ・ ${L.klbl[kIdx(x.karma)]} ${x.karma} ・ ${x.bankrupt ? tr('bankruptAt',{age:x.age, y:x.y0 + x.age - START_AGE}) : tr('retired',{y:x.y0 + END_AGE - START_AGE})}</small>
        <small>${escapeHtml(L.routeNames[x.route] || x.route)} ・ ${escapeHtml(txt(modeById(x.mode).name))} ・ ${x.d} ・ v${x.v}</small></div></li>`; }).join('')}</ul>`
      : `<div class="dhint" style="margin-top:20px">${tr('histEmpty')}</div>`);
  $('subScr').classList.remove('hidden'); $('subScr').scrollTop = 0; ui.sub = 'hist';
}
function closeSub(){ $('subScr').classList.add('hidden'); ui.sub = null; }

/* ==================== 意見を送る ==================== */
function showFeedback(){
  const d = D();
  $('fbPanel').innerHTML = `<div class="rh2" style="margin-bottom:6px">${tr('fbTitle')}</div><div class="tag" style="margin:0">${tr('fbIntro')}</div>
    <label>${tr('fbCat')}</label><select id="fbCat">${d.fbCats.map((c,i) => `<option value="${i}">${c}</option>`).join('')}</select>
    <label>${tr('fbMsg')}</label><textarea id="fbMsg" maxlength="2000" placeholder="${tr('fbMsgPh')}"></textarea>
    <label>${tr('fbContact')}</label><input type="text" id="fbContact" maxlength="200">
    <label class="chk"><input type="checkbox" id="fbAttach" checked> ${tr('fbAttach')}</label>
    <div class="note" style="text-align:left">${tr('fbNote')}</div>
    <div class="fbrow"><button class="bigbtn ghost" id="fbCancel">${tr('fbCancel')}</button><button class="bigbtn primary" id="fbSend">${tr('fbSend')}</button></div>`;
  $('fbScr').classList.remove('hidden');
  ui.fbWasPaused = ui.paused; ui.paused = true; if(S) render();
  $('fbCancel').onclick = closeFeedback;
  $('fbSend').onclick = sendFeedback;
}
function closeFeedback(){ $('fbScr').classList.add('hidden'); if(S && ui.running) { ui.paused = ui.fbWasPaused; render(); } }
function feedbackMeta(){
  const m = [`v${VERSION}`, `lang:${LANG}`, `ua:${navigator.userAgent.slice(0,120)}`];
  if($('fbAttach') && $('fbAttach').checked && S){
    m.push(`mode:${S.mode}`, `route:${S.route}`, `age:${S.age}`, `assets:${Math.round(total())}`, `karma:${Math.round(S.karma)}`);
    if(S.final) m.push(`title:${S.final.key}`, `rarity:${S.final.rarity}`);
  }
  return m.join(' / ');
}
function sendFeedback(){
  const msg = $('fbMsg').value.trim();
  if(!msg){ flash(tr('fbEmpty')); return; }
  const cat = D().fbCats[+$('fbCat').value], contact = $('fbContact').value.trim(), meta = feedbackMeta();
  const body = `[${cat}]\n${msg}\n\n${contact ? 'contact: '+contact+'\n' : ''}${meta}`;
  if(FEEDBACK_FORM){
    const url = FEEDBACK_FORM.replace('{category}', encodeURIComponent(cat)).replace('{message}', encodeURIComponent(msg))
      .replace('{contact}', encodeURIComponent(contact)).replace('{meta}', encodeURIComponent(meta));
    window.open(url, '_blank', 'noopener'); flash(tr('fbOpened')); closeFeedback();
  } else if(FEEDBACK_EMAIL){
    location.href = `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent('[HISTORY TRADER] ' + cat)}&body=${encodeURIComponent(body)}`;
    flash(tr('fbOpened')); closeFeedback();
  } else {
    const done = () => { flash(tr('fbCopied')); closeFeedback(); };
    if(navigator.clipboard) navigator.clipboard.writeText(body).then(done, done); else done();
  }
}

/* ==================== 言語の切り替え ==================== */
function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-Hans' : LANG;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = tr(el.dataset.i); });
  $('langRow').innerHTML = Object.entries(LANGS).map(([c, n]) => `<button data-lang="${c}" class="${c===LANG?'on':''}">${n}</button>`).join('');
  $('langSel').innerHTML = Object.entries(LANGS).map(([c, n]) => `<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('');
  $('tagLine').innerHTML = tr('tag');
  $('rulesList').innerHTML = D().rules.map(r => `<li>${r}</li>`).join('');
  $('btnAuto').title = tr('autoChip');
  $('verTitle').textContent = $('verGame').textContent = 'v' + VERSION;
  $('chlogBody').innerHTML = CONST_CHANGELOG.map(c => `<p><b>v${c.v}</b>（${c.date}）<br>${escapeHtml(txt(c.text))}</p>`).join('');
  refreshTitleButtons();
  if(ui.sub === 'ach') showAch(); else if(ui.sub === 'hist') showHist();
  if(!ui.running) $('tickerText').textContent = tr('tickerInit');
  ui.skKey = null; ui.avatar = null;
  if(S) render();
  ui.dirty = true;
  if(!$('setupScr').classList.contains('hidden')) showSetup(ui.setupStep || 'mode');
  if(!$('dexScr').classList.contains('hidden')) showDex(typeof ui.dexOpen === 'string' ? ui.dexOpen : undefined);
  if(!$('resultScr').classList.contains('hidden') && S && S.final) showResult();
  if(!$('fbScr').classList.contains('hidden')) showFeedback();
}
function setLang(c){
  if(!I18N[c]) return;
  LANG = c; try{ localStorage.setItem(LANG_KEY, c); }catch(e){}
  applyLang();
}
function refreshTitleButtons(){
  $('btnDex').textContent = tr('dexBtn',{n:dexCount(loadDex())});
  const un = loadJSON(ACH_KEY, {});
  $('btnAch').textContent = tr('achBtn',{n:CONST_ACHIEVEMENTS.filter(a => un[a.id]).length, N:CONST_ACHIEVEMENTS.length});
  const sv = loadSave(), bc = $('btnContinue');
  if(sv){
    bc.classList.remove('hidden');
    bc.textContent = tr('continue',{age:sv.age, year:sv.y0 + sv.age - START_AGE});
    $('btnNew').className = 'bigbtn ghost';
  } else { bc.classList.add('hidden'); $('btnNew').className = 'bigbtn primary'; }
}
function showTitle(){ refreshTitleButtons(); $('titleScr').classList.remove('hidden'); }

/* ==================== ループ ==================== */
let last = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = last ? Math.min(ts-last, 250) : 0; last = ts;
  if(S && ui.running && !ui.paused && !S.over){
    acc += dt;
    const iv = BASE_MS / S.speed; let n = 0;
    while(acc>=iv && n<16 && !S.over){ acc-=iv; step(); n++; }
    if(n){ render(); ui.dirty = true; }
    if(!S.over) $('yearFill').style.width = ((S.tick + acc/iv)/TPY*100)+'%';
  }
  if(S && (ui.dirty || (ui.running && !ui.paused))){ drawChart(); ui.dirty = false; }
}

/* ==================== 操作 ==================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(b){ trade(b.dataset.act, b.dataset.k, +b.dataset.f); return; }
  const s = e.target.closest('.spd');
  if(s && S){ S.speed = +s.dataset.s; ui.paused = false; render(); return; }
  const m = e.target.closest('[data-m]');
  if(m){ ui.mode = m.dataset.m; document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===m)); ui.dirty=true; return; }
  const r = e.target.closest('[data-r]');
  if(r){ ui.range = r.dataset.r; document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===r)); ui.dirty=true; return; }
  const lb = e.target.closest('[data-lang]');
  if(lb){ setLang(lb.dataset.lang); return; }
  if(e.target.closest('[data-fb]')){ showFeedback(); return; }
  const op = e.target.closest('[data-open]');
  if(op){ op.dataset.open==='ach' ? showAch() : showHist(); return; }
  if(e.target.closest('[data-close]')){ closeSub(); return; }
});
$('langSel').onchange = e => setLang(e.target.value);
$('btnPause').onclick = () => { if(!S||S.over||!ui.running) return; ui.paused = !ui.paused; if(ui.paused) save(); render(); };
$('btnAuto').onclick = () => { if(S && ui.running && !S.over) setAuto(!S.auto); };
$('margin').onchange = e => {
  if(!S || S.over || S.auto){ e.target.checked = !!(S && S.margin); return; }
  S.margin = e.target.checked;
  if(S.margin) S.marginEver = true;
  if(S.margin) flash(tr('marginOn',{r:loanRate()*100}));
  render();
};
$('btnNew').onclick = () => {
  if(loadSave() && !confirm(tr('confirmNew'))) return;
  clearSave(); showSetup('mode');
};
$('btnContinue').onclick = () => { const sv = loadSave(); if(sv){ S = sv; startGame(true); } };
document.addEventListener('visibilitychange', () => {
  if(document.hidden && S && ui.running){ if(!S.auto) ui.paused = true; save(); render(); }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { ui.dirty = true; });

newState(); ui.running = false;
applyLang(); render();
showTitle();
requestAnimationFrame(loop);
})();
</script>
</body>
